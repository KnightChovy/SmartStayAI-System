tags:
  - name: Auth
    description: Authentication
  - name: Users
    description: User management and retrieval
  - name: Uploads
    description: File upload (Cloudinary)
  - name: HotelPartners
    description: Hotel partner registration and verification

paths:
  /auth/send-otp:
    post:
      summary: Send OTP verification code
      description: Generates a 6-digit verification code and emails it to the user.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
              example:
                email: khiembadinh987@gmail.com
      responses:
        "200":
          description: OTP Sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Verification OTP sent successfully to khiembadinh987@gmail.com
        "400":
          description: Email already taken or invalid format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register:
    post:
      summary: Register as user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                  description: must be unique
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: At least one number and one letter
              example:
                name: fake name
                email: fake@example.com
                password: password1
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  tokens:
                    $ref: '#/components/schemas/AuthTokens'
        "400":
          $ref: '#/components/responses/DuplicateEmail'

  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              example:
                email: fake@example.com
                password: password1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  tokens:
                    $ref: '#/components/schemas/AuthTokens'
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: Invalid email or password

  /auth/logout:
    post:
      summary: Logout
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
              example:
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1ZWJhYzUzNDk1NGI1NDEzOTgwNmMxMTIiLCJpYXQiOjE1ODkyOTg0ODQsImV4cCI6MTU4OTMwMDI4NH0.m1U63blB0MLej_WfB7yC2FTMnCziif9X8yzwDEfJXAg
      responses:
        "204":
          description: No content
        "404":
          $ref: '#/components/responses/NotFound'

  /auth/refresh-tokens:
    post:
      summary: Refresh auth tokens
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
              example:
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1ZWJhYzUzNDk1NGI1NDEzOTgwNmMxMTIiLCJpYXQiOjE1ODkyOTg0ODQsImV4cCI6MTU4OTMwMDI4NH0.m1U63blB0MLej_WfB7yC2FTMnCziif9X8yzwDEfJXAg
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      summary: Forgot password
      description: An email will be sent to reset password.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
              example:
                email: fake@example.com
      responses:
        "204":
          description: No content
        "404":
          $ref: '#/components/responses/NotFound'

  /auth/reset-password:
    post:
      summary: Reset password
      tags: [Auth]
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: The reset password token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: At least one number and one letter
              example:
                password: password1
      responses:
        "204":
          description: No content
        "401":
          description: Password reset failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: Password reset failed

  /auth/send-verification-email:
    post:
      summary: Send verification email
      description: An email will be sent to verify email.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No content
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/verify-email:
    post:
      summary: verify email
      tags: [Auth]
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: The verify email token
      responses:
        "204":
          description: No content
        "401":
          description: verify email failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: verify email failed

  /users:
    post:
      summary: Create a user
      description: Only admins can create other users.
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - role
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                  description: must be unique
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: At least one number and one letter
                role:
                   type: string
                   enum: [user, admin]
              example:
                name: fake name
                email: fake@example.com
                password: password1
                role: user
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/DuplicateEmail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

    get:
      summary: Get all users
      description: Only admins can retrieve all users.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: User name
        - in: query
          name: role
          schema:
            type: string
          description: User role
        - in: query
          name: sortBy
          schema:
            type: string
          description: sort by query in the form of field:desc/asc (ex. name:asc)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          default: 10
          description: Maximum number of users
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
                  totalPages:
                    type: integer
                    example: 1
                  totalResults:
                    type: integer
                    example: 1
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    get:
      summary: Get a user
      description: Logged in users can fetch only their own user information. Only admins can fetch other users.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: User id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/User'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update a user
      description: Logged in users can only update their own information. Only admins can update other users.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: User id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                  description: must be unique
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: At least one number and one letter
              example:
                name: fake name
                email: fake@example.com
                password: password1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/DuplicateEmail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete a user
      description: Logged in users can delete only themselves. Only admins can delete other users.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: User id
      responses:
        "200":
          description: No content
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /uploads:
    post:
      summary: Upload a file to Cloudinary
      description: Uploads a single image/PDF (multipart field "file") and returns its public URL.
      tags: [Uploads]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: folder
          schema:
            type: string
            enum: [licenses, representatives, properties, documents]
          description: Cloudinary sub-folder to group the file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: https://res.cloudinary.com/demo/image/upload/v1/smartstay/licenses/abc.jpg
                  publicId:
                    type: string
                    example: smartstay/licenses/abc
        "400":
          description: No file uploaded or invalid file type/size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /hotel-partners/registrations:
    post:
      summary: Submit a hotel partner registration
      description: >
        Creates a HotelPartner (pending), a Hotel (not yet active), its licenses, representative,
        images, payout account and a pending verification request — all in one transaction.
        Any authenticated user can submit. File URLs must be uploaded via POST /uploads first.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelRegistrationRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationRequest'
        "400":
          description: Validation error or duplicate pending/approved partner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
    get:
      summary: List verification requests (platform manager)
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_review, approved, rejected]
        - in: query
          name: sortBy
          schema:
            type: string
          description: "field:(desc|asc) e.g. submittedAt:desc"
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/HotelVerificationRequestSummary'
                  page: { type: integer, example: 1 }
                  limit: { type: integer, example: 10 }
                  totalPages: { type: integer, example: 1 }
                  totalResults: { type: integer, example: 1 }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /hotel-partners/registrations/me:
    get:
      summary: List my own verification requests
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HotelVerificationRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /hotel-partners/registrations/{requestId}:
    get:
      summary: Get a verification request by id
      description: Accessible by the owner or a platform manager.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotel-partners/registrations/{requestId}/review:
    patch:
      summary: Approve or reject a verification request (platform manager)
      description: >
        On approve - partner becomes approved, hotel becomes active and listed,
        the owner user's role is upgraded to hotel_partner. On reject - a rejectionReason is required.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                rejectionReason:
                  type: string
                  description: Required when decision is "reject"
      responses:
        "200":
          description: Reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationRequest'
        "400":
          description: Already reviewed or invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotel-partners/documents/{documentId}/review:
    patch:
      summary: Approve or reject a single document (platform manager)
      description: >
        Fine-grained review (Hướng B). On approve, if the document type is also a license type,
        the matching license's current_document_id is set to this document.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
      responses:
        "200":
          description: Reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationDocument'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotel-partners/documents/{documentId}/replace:
    post:
      summary: Re-upload a rejected document (owner)
      description: The partner who owns the document submits a new file URL; a new pending document is created and the old one is marked replaced.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileUrl
              properties:
                fileUrl:
                  type: string
                  format: uri
      responses:
        "201":
          description: Replacement document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationDocument'
        "400":
          description: Document is not in a rejected state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
