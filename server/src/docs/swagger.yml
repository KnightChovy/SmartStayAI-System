  /users/{userId}/status:
    patch:
      summary: Change a user's account status (admin)
      description: >
        Admin/platform_manager (manageUsers) sets a user's status to active, inactive or suspended.
        Suspending takes effect immediately — both login and JWT verification reject non-active users.
        Cannot change your own status.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [active, inactive, suspended]
              example:
                status: suspended
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Cannot change your own status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /users/{userId}/role:
    patch:
      summary: Change a user's role (admin only)
      description: >
        Requires the manageRoles right (admin only — platform_manager does NOT have it). Cannot change
        your own role, and cannot demote the last remaining admin.
      tags: [Users]
      security:
