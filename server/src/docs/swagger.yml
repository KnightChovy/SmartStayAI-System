tags:
  - name: Auth
    description: Authentication
  - name: Users
    description: User management and retrieval
  - name: Uploads
    description: File upload (Cloudinary)
  - name: HotelPartners
    description: Hotel partner registration and verification
  - name: Hotels
    description: Public hotel & room search
  - name: Bookings
    description: Booking creation, cancellation and listing
  - name: Payments
    description: VNPay payment — create payment URL and handle gateway callbacks
  - name: HotelManagement
    description: Partner management of room types, rooms, pricing rules and staff (hotel owner or manageHotels right)
  - name: Amenities
    description: Amenity catalog (list public, create admin-only)
  - name: Chatbot
    description: Per-hotel AI chatbot (LLM provider is swappable via the AiProvider switch)

paths:
  /conversations/messages:
    post:
      summary: Send a message to a hotel's chatbot
      description: >
        Authenticated guest sends one message to a hotel's AI chatbot. If conversationId is omitted a
        new conversation is created; otherwise the message continues that conversation (the full history
        is replayed to the LLM each turn). Returns the bot reply and the conversationId to reuse next turn.
      tags: [Chatbot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hotelId
                - message
              properties:
                hotelId:
                  type: string
                  format: uuid
                conversationId:
                  type: string
                  format: uuid
                  description: Omit to start a new conversation
                message:
                  type: string
                  maxLength: 2000
              example:
                hotelId: 11111111-1111-1111-1111-111111111111
                message: Khách sạn mình có hồ bơi không?
      responses:
        "201":
          description: Bot reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversationId:
                    type: string
                    format: uuid
                  reply:
                    type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /conversations/messages/stream:
    post:
      summary: Send a message and stream the reply (SSE)
      description: >
        Same body as /conversations/messages, but the reply is streamed token-by-token over
        Server-Sent Events. Emits an "meta" event with the conversationId, then "chunk" events with
        partial text, then a "done" event. The full reply is saved to the DB after streaming ends.
      tags: [Chatbot]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hotelId
                - message
              properties:
                hotelId:
                  type: string
                  format: uuid
                conversationId:
                  type: string
                  format: uuid
                message:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /auth/send-otp:
    post:
      summary: Send OTP verification code
      description: Generates a 6-digit verification code and emails it to the user.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
              example:
                email: khiembadinh987@gmail.com
      responses:
        "200":
          description: OTP Sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Verification OTP sent successfully to khiembadinh987@gmail.com
        "400":
          description: Email already taken or invalid format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register:
    post:
      summary: Register as user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                  description: must be unique
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: At least one number and one letter
              example:
                name: fake name
                email: fake@example.com
                password: password1
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  tokens:
                    $ref: '#/components/schemas/AuthTokens'
        "400":
          $ref: '#/components/responses/DuplicateEmail'

  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              example:
                email: fake@example.com
                password: password1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  tokens:
                    $ref: '#/components/schemas/AuthTokens'
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: Invalid email or password

  /auth/logout:
    post:
      summary: Logout
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
              example:
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1ZWJhYzUzNDk1NGI1NDEzOTgwNmMxMTIiLCJpYXQiOjE1ODkyOTg0ODQsImV4cCI6MTU4OTMwMDI4NH0.m1U63blB0MLej_WfB7yC2FTMnCziif9X8yzwDEfJXAg
      responses:
        "204":
          description: No content
        "404":
          $ref: '#/components/responses/NotFound'

  /auth/refresh-tokens:
    post:
      summary: Refresh auth tokens
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
              example:
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1ZWJhYzUzNDk1NGI1NDEzOTgwNmMxMTIiLCJpYXQiOjE1ODkyOTg0ODQsImV4cCI6MTU4OTMwMDI4NH0.m1U63blB0MLej_WfB7yC2FTMnCziif9X8yzwDEfJXAg
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      summary: Forgot password
      description: An email will be sent to reset password.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
              example:
                email: fake@example.com
      responses:
        "204":
          description: No content
        "404":
          $ref: '#/components/responses/NotFound'

  /auth/reset-password:
    post:
      summary: Reset password
      tags: [Auth]
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: The reset password token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: At least one number and one letter
              example:
                password: password1
      responses:
        "204":
          description: No content
        "401":
          description: Password reset failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: Password reset failed

  /auth/send-verification-email:
    post:
      summary: Send verification email
      description: An email will be sent to verify email.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No content
        "401":
          $ref: '#/components/responses/Unauthorized'

  /auth/verify-email:
    post:
      summary: verify email
      tags: [Auth]
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: The verify email token
      responses:
        "204":
          description: No content
        "401":
          description: verify email failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: verify email failed

  /users:
    post:
      summary: Create a user
      description: Only admins can create other users.
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - role
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                  description: must be unique
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: At least one number and one letter
                role:
                   type: string
                   enum: [user, admin]
              example:
                name: fake name
                email: fake@example.com
                password: password1
                role: user
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/DuplicateEmail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

    get:
      summary: Get all users
      description: Only admins can retrieve all users.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: User name
        - in: query
          name: role
          schema:
            type: string
          description: User role
        - in: query
          name: sortBy
          schema:
            type: string
          description: sort by query in the form of field:desc/asc (ex. name:asc)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          default: 10
          description: Maximum number of users
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
                  totalPages:
                    type: integer
                    example: 1
                  totalResults:
                    type: integer
                    example: 1
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    get:
      summary: Get a user
      description: Logged in users can fetch only their own user information. Only admins can fetch other users.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: User id
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/User'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update a user
      description: Logged in users can only update their own information. Only admins can update other users.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: User id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                  description: must be unique
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: At least one number and one letter
              example:
                name: fake name
                email: fake@example.com
                password: password1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                 $ref: '#/components/schemas/User'
        "400":
          $ref: '#/components/responses/DuplicateEmail'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete a user
      description: Logged in users can delete only themselves. Only admins can delete other users.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: User id
      responses:
        "200":
          description: No content
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /uploads:
    post:
      summary: Upload a file to Cloudinary
      description: Uploads a single image/PDF (multipart field "file") and returns its public URL.
      tags: [Uploads]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: folder
          schema:
            type: string
            enum: [licenses, representatives, properties, documents]
          description: Cloudinary sub-folder to group the file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: https://res.cloudinary.com/demo/image/upload/v1/smartstay/licenses/abc.jpg
                  publicId:
                    type: string
                    example: smartstay/licenses/abc
        "400":
          description: No file uploaded or invalid file type/size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /hotel-partners/registrations:
    post:
      summary: Submit a hotel partner registration
      description: >
        Reuses the user's active partner or creates one if none (a partner can own multiple hotels),
        then creates a Hotel (not yet active), its licenses, representative, images, payout account,
        room config and a pending verification request — all in one transaction.
        Any authenticated user can submit. File URLs must be uploaded via POST /uploads first.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelRegistrationRequest'
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationRequest'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
    get:
      summary: List verification requests (platform manager)
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_review, approved, rejected]
        - in: query
          name: sortBy
          schema:
            type: string
          description: "field:(desc|asc) e.g. submittedAt:desc"
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/HotelVerificationRequestSummary'
                  page: { type: integer, example: 1 }
                  limit: { type: integer, example: 10 }
                  totalPages: { type: integer, example: 1 }
                  totalResults: { type: integer, example: 1 }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /hotel-partners/registrations/me:
    get:
      summary: List my own verification requests
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HotelVerificationRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'

  /hotel-partners/registrations/{requestId}:
    get:
      summary: Get a verification request by id
      description: Accessible by the owner or a platform manager.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotel-partners/registrations/{requestId}/review:
    patch:
      summary: Approve or reject a verification request (platform manager)
      description: >
        On approve - partner becomes approved, the owner user's role is upgraded to hotel_partner,
        the hotel is activated but NOT yet published (isListed=false), RoomType + Room records are
        seeded from the declared roomConfig (rooms inactive until the partner completes details and
        publishes in Room Inventory), and the partner receives a 'partner_approved' notification.
        On reject - a rejectionReason is required.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                rejectionReason:
                  type: string
                  description: Required when decision is "reject"
      responses:
        "200":
          description: Reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationRequest'
        "400":
          description: Already reviewed or invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotel-partners/documents/{documentId}/review:
    patch:
      summary: Approve or reject a single document (platform manager)
      description: >
        Fine-grained review (Hướng B). On approve, if the document type is also a license type,
        the matching license's current_document_id is set to this document.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
      responses:
        "200":
          description: Reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationDocument'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotels:
    get:
      summary: Search hotels by city (with availability check)
      description: >
        Public. Returns active & listed hotels. When checkIn/checkOut are provided (they must go
        together), only hotels with at least one room type available for every night of the stay
        are returned. Each result includes minPrice (lowest base price among matching room types).
      tags: [Hotels]
      parameters:
        - in: query
          name: city
          schema:
            type: string
          description: Case-insensitive partial match
        - in: query
          name: checkIn
          schema:
            type: string
            format: date
        - in: query
          name: checkOut
          schema:
            type: string
            format: date
          description: Must be after checkIn
        - in: query
          name: guests
          schema:
            type: integer
            minimum: 1
          description: Only hotels having a room type with maxOccupancy >= guests
        - in: query
          name: sortBy
          schema:
            type: string
          description: "field:(desc|asc) e.g. starRating:desc"
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
      responses:
        "200":
          description: Paginated hotel list ({ results, page, limit, totalPages, totalResults })
        "400":
          description: Invalid query (e.g. checkIn without checkOut)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /hotels/{hotelId}:
    get:
      summary: Get a hotel's full profile by id
      description: >
        Public. Returns one active & listed hotel with all images, hotel amenities and its active
        room types (each with images, amenities and base price). Date-based availability/pricing is
        fetched separately via GET /hotels/{hotelId}/room-types?checkIn=&checkOut=.
      tags: [Hotels]
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: "Hotel profile (info + images + amenities + active room types)" }
        "404": { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/manage:
    get:
      summary: Get a hotel's full profile for management (owner/manager)
      description: >
        Auth. Returns the hotel REGARDLESS of status (including unlisted/pending) for the owner
        (or a user with the manageHotels right) — used by the partner's Hotel Management screen.
        Includes all images, amenities and ALL room types (active + inactive), each with its room count.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: "Full hotel profile (any status) for management" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /hotels/mine:
    get:
      summary: List hotels owned by the current partner
      description: >
        Auth. Returns every hotel owned by the LOGGED-IN user (partner) — including unlisted/pending
        ones (soft-deleted excluded) — for the partner's Hotel Management screen. The owner id is taken
        from the token, NOT the URL. Each item includes the cover image and a count of room types and rooms.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      responses:
        "200": { description: "Array of hotels (each with primary image + _count of roomTypes/rooms)" }
        "401": { $ref: '#/components/responses/Unauthorized' }

  /hotels/{hotelId}/room-types:
    get:
      summary: Search room types within a hotel (with filters)
      description: >
        Public. Filters by capacity, price range, bed type and view type. When checkIn/checkOut
        are provided, each room type includes numNights, availableRooms and totalPrice for the
        stay (per-night priceOverride applied), and sold-out room types are excluded.
      tags: [Hotels]
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: checkIn
          schema:
            type: string
            format: date
        - in: query
          name: checkOut
          schema:
            type: string
            format: date
        - in: query
          name: guests
          schema:
            type: integer
            minimum: 1
        - in: query
          name: minPrice
          schema:
            type: number
        - in: query
          name: maxPrice
          schema:
            type: number
        - in: query
          name: bedType
          schema:
            type: string
        - in: query
          name: viewType
          schema:
            type: string
      responses:
        "200":
          description: Room types with images & amenities (plus availability and total price when dates given)
        "404":
          $ref: '#/components/responses/NotFound'

  /bookings:
    post:
      summary: Create a booking
      description: >
        Authenticated customers book one room of a room type for [checkInDate, checkOutDate).
        Prices are computed server-side (per-night priceOverride if set, else basePrice).
        Inventory is reserved per night inside a transaction, so concurrent bookings cannot
        oversell. paymentMethod "vnpay" (default) creates a "pending" booking held 15 min for online
        payment; "cash" (pay at hotel) creates a "confirmed" booking with no hold plus a pending cash
        Payment and an e-voucher — staff records the cash later via record-cash-payment.
      tags: [Bookings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hotelId
                - roomTypeId
                - checkInDate
                - checkOutDate
                - numGuests
              properties:
                hotelId:
                  type: string
                  format: uuid
                roomTypeId:
                  type: string
                  format: uuid
                checkInDate:
                  type: string
                  format: date
                checkOutDate:
                  type: string
                  format: date
                  description: Must be after checkInDate (max 30 nights)
                numGuests:
                  type: integer
                  minimum: 1
                specialRequests:
                  type: string
                paymentMethod:
                  type: string
                  enum: [vnpay, cash]
                  default: vnpay
                  description: vnpay = pay online now; cash = pay at the hotel on arrival
              example:
                hotelId: 11111111-1111-1111-1111-111111111111
                roomTypeId: 22222222-2222-2222-2222-222222222222
                checkInDate: "2026-07-01"
                checkOutDate: "2026-07-03"
                numGuests: 2
                paymentMethod: cash
      responses:
        "201":
          description: Booking created (includes bookingCode, totals, hotel & roomType summary)
        "400":
          description: Sold out for a night, past check-in date, or capacity exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          $ref: '#/components/responses/NotFound'

  /bookings/me:
    get:
      summary: List my bookings
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, checked_in, checked_out, cancelled, no_show]
        - in: query
          name: sortBy
          schema:
            type: string
          description: "field:(desc|asc) e.g. createdAt:desc"
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
      responses:
        "200":
          description: Paginated booking list ({ results, page, limit, totalPages, totalResults })
        "401":
          $ref: '#/components/responses/Unauthorized'

  /bookings/{bookingId}:
    get:
      summary: Get a booking by id
      description: Accessible by the booking owner or a user with the manageBookings right.
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: OK
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /bookings/{bookingId}/cancel:
    patch:
      summary: Cancel a booking
      description: >
        Owner (or manageBookings) cancels a pending/confirmed booking before its check-in date.
        Reserved inventory is released for every night of the stay. If the booking was paid, a refund
        is computed from the hotel's cancellation policy (default: full refund if cancelled ≥48h before
        check-in, otherwise the first night is kept as a penalty): a Refund record is created, the
        Payment is marked refunded on a full refund, and the platform commission is adjusted to the
        amount the hotel actually keeps. The response includes a `refund` summary when applicable.
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        "200":
          description: Booking cancelled
        "400":
          description: Not cancellable (wrong status or check-in date reached)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /payments/bookings/{bookingId}/vnpay:
    post:
      summary: Create a VNPay payment URL for a booking
      description: >
        Owner of a pending (not yet expired) booking requests a VNPay payment URL.
        Creates a pending Payment row and returns the gateway URL the frontend should redirect to.
        Requires VNP_TMN_CODE / VNP_HASH_SECRET to be configured (503 otherwise).
      tags: [Payments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Payment URL created
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentUrl:
                    type: string
                    example: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html?vnp_Amount=...
        "400":
          description: Booking not payable (wrong status or hold expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "503":
          description: VNPay not configured

  /payments/vnpay/return:
    get:
      summary: VNPay browser return URL (public)
      description: >
        VNPay redirects the user's browser here after payment. The signature (vnp_SecureHash)
        is verified server-side; on success the booking is confirmed, commission recorded and an
        e-voucher issued. The endpoint then 302-redirects to the client payment-result page.
      tags: [Payments]
      parameters:
        - in: query
          name: vnp_TxnRef
          schema:
            type: string
        - in: query
          name: vnp_ResponseCode
          schema:
            type: string
        - in: query
          name: vnp_SecureHash
          schema:
            type: string
      responses:
        "302":
          description: Redirect to client payment-result page

  /payments/vnpay/ipn:
    get:
      summary: VNPay IPN endpoint (server-to-server, public)
      description: >
        VNPay calls this server-to-server to confirm the transaction outcome. Same verification and
        confirmation logic as the return URL, but responds with the VNPay JSON contract
        ({ RspCode, Message }). Idempotent on repeated calls.
      tags: [Payments]
      responses:
        "200":
          description: VNPay acknowledgement
          content:
            application/json:
              schema:
                type: object
                properties:
                  RspCode:
                    type: string
                    example: "00"
                  Message:
                    type: string
                    example: Thanh toán thành công

  /hotels/{hotelId}/bookings:
    get:
      summary: List a hotel's bookings (staff/owner)
      description: >
        Owner, platform manager, or assigned staff lists bookings of the hotel, filtered by status
        and check-in date range. Each item includes customer, assigned rooms and voucher info.
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, checked_in, checked_out, cancelled, no_show]
        - in: query
          name: fromDate
          schema:
            type: string
            format: date
        - in: query
          name: toDate
          schema:
            type: string
            format: date
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
      responses:
        "200":
          description: Paginated bookings
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/bookings/{bookingId}/check-in:
    post:
      summary: Check in a confirmed booking (staff)
      description: >
        Moves a confirmed (paid) booking to checked_in, assigns one available physical room of the
        booking's room type (or the room given by roomId), marks the e-voucher used. Optionally
        verifies the scanned voucherCode. Only allowed within the stay window
        (checkInDate <= today < checkOutDate) — too early or past the stay is rejected.
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  format: uuid
                  description: Optional specific physical room to assign
                voucherCode:
                  type: string
                  description: Optional e-voucher code to verify at the desk
      responses:
        "200":
          description: Booking checked in (with assigned room)
        "400":
          description: Not confirmed, voucher mismatch, or no free room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/bookings/{bookingId}/check-out:
    post:
      summary: Check out a staying booking and issue an invoice (staff)
      description: >
        Moves a checked_in booking to checked_out, frees the assigned room(s) to cleaning status,
        and issues an Invoice (room subtotal + optional extra charge).
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                extraCharge:
                  type: number
                  minimum: 0
                  description: Extra charges incurred during the stay (added to the invoice total)
      responses:
        "200":
          description: Booking checked out (response includes the issued invoice)
        "400":
          description: Booking is not currently checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/bookings/{bookingId}/no-show:
    post:
      summary: Mark a booking as no-show (staff)
      description: >
        Staff marks a confirmed booking whose check-in date has passed as no_show (guest never
        arrived). Prepaid (VNPay) bookings are forfeited — no refund, commission kept. A still-pending
        cash payment is marked failed. Inventory is not released.
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Booking marked no_show
        "400":
          description: Not confirmed, or check-in date not reached yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/bookings/{bookingId}/record-cash-payment:
    post:
      summary: Record cash received for a pay-at-hotel booking (staff)
      description: >
        Staff marks the pending cash Payment of a "pay at hotel" booking as completed (money collected
        at the desk) and records the platform commission at that point. Idempotent — a second call on
        an already-collected booking is rejected.
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Cash payment recorded
        "400":
          description: No pending cash payment, or booking cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/bookings/{bookingId}:
    get:
      summary: Get one booking of a hotel (staff)
      description: >
        Owner, manager, or assigned staff fetches a single booking's detail (customer, assigned rooms,
        voucher, payments, and the invoice if already issued).
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Booking detail
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/rooms/{roomId}/status:
    patch:
      summary: Update a room's status (staff room map / housekeeping)
      description: >
        Assigned staff (or owner/manager) quickly changes a room's operational status
        (available / occupied / maintenance / cleaning) — used by the room map and housekeeping.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: roomId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [available, occupied, maintenance, cleaning]
      responses:
        "200":
          description: Room status updated
        "400":
          description: Invalid status
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/housekeeping:
    get:
      summary: List housekeeping tasks (staff)
      description: >
        Assigned staff lists the hotel's housekeeping (room cleaning) tasks, optionally filtered by
        status. Tasks are auto-created when a booking checks out.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_progress, done]
      responses:
        "200":
          description: Housekeeping tasks (each with its room)
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/housekeeping/{taskId}/complete:
    post:
      summary: Complete a housekeeping task (staff, 1-tap)
      description: >
        Marks a cleaning task done and returns the room to "available" (only if it is still in
        "cleaning"). Rejected if the task is already done.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Task completed, room freed
        "400":
          description: Task already done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/staff:
    get:
      summary: List staff assigned to a hotel (owner)
      description: Hotel owner or manageHotels lists active staff assignments (with user info).
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Active staff assignments
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a staff account and assign it to the hotel (owner)
      description: >
        Hotel owner or manageHotels creates an active staff user account (no OTP — the owner vouches)
        and assigns it to the hotel. assignedRole ("staff" or "marketer") also becomes the user's
        global role. After this the staff member can log in and operate the hotel's bookings.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  description: Min 8 chars, at least 1 letter and 1 number
                phone:
                  type: string
                assignedRole:
                  type: string
                  enum: [staff, marketer]
                  default: staff
      responses:
        "201":
          description: Staff account created and assigned (user is returned without passwordHash)
        "400":
          description: Email already taken or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/staff/{userId}:
    delete:
      summary: Unassign a staff member from the hotel (owner)
      description: >
        Ends a staff member's assignment (sets unassignedAt) so they lose access to the hotel's
        operations. The user account itself is not deleted.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Staff unassigned
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          description: No active assignment for this staff at the hotel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /hotels/{hotelId}/room-types/manage:
    get:
      summary: List room types for management (includes inactive)
      description: Hotel owner or manageHotels. Each item includes images, amenities and physical room count.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: OK }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/room-types/create:
    post:
      summary: Create a room type (actual path is POST /hotels/{hotelId}/room-types)
      description: >
        Hotel owner or manageHotels. NOTE - the real path is POST /hotels/{hotelId}/room-types
        (documented here separately because the GET on that path is the public search).
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, maxOccupancy, basePrice]
              properties:
                name: { type: string }
                description: { type: string }
                maxOccupancy: { type: integer, minimum: 1, maximum: 20 }
                basePrice: { type: number, minimum: 0 }
                areaSqm: { type: number }
                bedType: { type: string }
                viewType: { type: string }
                isActive: { type: boolean, default: true }
              example:
                name: Phòng Deluxe Twin
                maxOccupancy: 3
                basePrice: 1200000
                bedType: twin
                viewType: city
      responses:
        "201": { description: Created }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/room-types/{roomTypeId}:
    put:
      summary: Update a room type
      description: Hotel owner or manageHotels. All fields optional; set isActive=false to stop selling.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: roomTypeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                maxOccupancy: { type: integer }
                basePrice: { type: number }
                areaSqm: { type: number }
                bedType: { type: string }
                viewType: { type: string }
                isActive: { type: boolean }
      responses:
        "200": { description: Updated }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/room-types/{roomTypeId}/images:
    post:
      summary: Add images to a room type
      description: >
        URLs must be uploaded via POST /uploads first. If any new image has isPrimary=true,
        the previous primary flag is cleared so there is always at most one primary image.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: roomTypeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [url]
                    properties:
                      url: { type: string, format: uri }
                      isPrimary: { type: boolean }
                      sortOrder: { type: integer }
      responses:
        "201": { description: Full image list of the room type }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/room-types/{roomTypeId}/amenities:
    put:
      summary: Set room type amenities (replace all, N-N)
      description: The sent list REPLACES the current amenity set; an empty array clears all amenities.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: roomTypeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amenityIds]
              properties:
                amenityIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "200": { description: Room type with the new amenity set }
        "400": { description: Some amenity ids do not exist }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/rooms:
    post:
      summary: Create a physical room
      description: >
        Room number must be unique within the hotel. Future room_availability rows of the
        room type get totalRooms incremented so already-priced nights sell the new room too.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomTypeId, roomNumber]
              properties:
                roomTypeId: { type: string, format: uuid }
                roomNumber: { type: string }
                floor: { type: integer }
                status: { type: string, enum: [available, occupied, maintenance, cleaning], default: available }
                notes: { type: string }
      responses:
        "201": { description: Created }
        "400": { description: Duplicate room number }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    get:
      summary: List physical rooms (filter by status, room type)
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [available, occupied, maintenance, cleaning] }
        - in: query
          name: roomTypeId
          schema: { type: string, format: uuid }
        - in: query
          name: sortBy
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer }
      responses:
        "200": { description: Paginated room list }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/rooms/{roomId}:
    put:
      summary: Update a room (status, number, floor, notes)
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: roomId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roomNumber: { type: string }
                floor: { type: integer }
                status: { type: string, enum: [available, occupied, maintenance, cleaning] }
                notes: { type: string }
              example:
                status: maintenance
                notes: Hỏng điều hoà, chờ linh kiện
      responses:
        "200": { description: Updated }
        "400": { description: Duplicate room number }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/pricing-rules:
    post:
      summary: Create a pricing rule
      description: >
        roomTypeId null/omitted = rule applies to the whole hotel. Matching nights get the
        highest-priority rule applied on top of (priceOverride ?? basePrice). early_bird rules
        match when TODAY (booking time) is inside [startDate, endDate]; other types match the
        stay night. occupancy rules require occupancyThreshold (% booked) and fire when the
        night's occupancy reaches it. adjustmentValue can be negative (discount).
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, ruleType, startDate, endDate, adjustmentType, adjustmentValue]
              properties:
                roomTypeId: { type: string, format: uuid, nullable: true }
                name: { type: string }
                ruleType: { type: string, enum: [seasonal, weekend, occupancy, early_bird] }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                dayOfWeek:
                  type: array
                  items: { type: integer, minimum: 0, maximum: 6 }
                  description: 0=Sunday..6=Saturday; empty = every day
                occupancyThreshold: { type: integer, minimum: 1, maximum: 100 }
                adjustmentType: { type: string, enum: [percentage, fixed] }
                adjustmentValue: { type: number, description: negative = discount }
                priority: { type: integer, default: 0 }
                isActive: { type: boolean, default: true }
              example:
                name: Phụ thu cuối tuần
                ruleType: weekend
                startDate: "2026-06-01"
                endDate: "2026-08-31"
                dayOfWeek: [5, 6]
                adjustmentType: percentage
                adjustmentValue: 20
                priority: 10
      responses:
        "201": { description: Created }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    get:
      summary: List pricing rules of a hotel
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: roomTypeId
          schema: { type: string, format: uuid }
        - in: query
          name: isActive
          schema: { type: boolean }
      responses:
        "200": { description: Rules ordered by priority desc }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/pricing-rules/{ruleId}:
    put:
      summary: Update a pricing rule
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: ruleId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any subset of the create fields
      responses:
        "200": { description: Updated }
        "400": { description: endDate before startDate after merge }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete a pricing rule
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: ruleId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }

  /amenities:
    get:
      summary: List all amenities
      description: Public. Optional category filter (room/hotel/service).
      tags: [Amenities]
      parameters:
        - in: query
          name: category
          schema: { type: string, enum: [room, hotel, service] }
      responses:
        "200": { description: OK }
    post:
      summary: Create an amenity (admin only)
      description: Requires the manageAmenities right (admin). Name is globally unique.
      tags: [Amenities]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name: { type: string }
                icon: { type: string }
                category: { type: string, enum: [room, hotel, service] }
              example:
                name: Máy pha cà phê
                icon: coffee
                category: room
      responses:
        "201": { description: Created }
        "400": { description: Duplicate name }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /hotel-partners/documents/{documentId}/replace:
    post:
      summary: Re-upload a rejected document (owner)
      description: The partner who owns the document submits a new file URL; a new pending document is created and the old one is marked replaced.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileUrl
              properties:
                fileUrl:
                  type: string
                  format: uri
      responses:
        "201":
          description: Replacement document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationDocument'
        "400":
          description: Document is not in a rejected state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
