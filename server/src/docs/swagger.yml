tags:
  - name: Auth
    description: Authentication
  - name: Users
    description: User management and retrieval
  - name: Uploads
    description: File upload (Cloudinary)
  - name: HotelPartners
    description: Hotel partner registration and verification
  - name: Hotels
    description: Public hotel & room search
  - name: Bookings
    description: Booking creation, cancellation and listing
  - name: Reviews
    description: Guest reviews — submit after checkout, public listing per hotel
  - name: Payments
    description: VNPay payment — create payment URL and handle gateway callbacks
  - name: HotelManagement
    description: Partner management of room types, rooms, pricing rules and staff (hotel owner or manageHotels right)
  - name: Revenue
    description: Per-hotel revenue report & wallet (balances + transaction ledger) for the hotel owner/manager
  - name: Amenities
    description: Amenity catalog (list public, create by partner/admin)
  - name: Chatbot
    description: >
      AI chatbot (LLM provider is swappable via the AiProvider switch). Two modes on the same endpoint:
      send hotelId for a PER-HOTEL concierge (search/book/cancel within that hotel), or omit hotelId for
      the PLATFORM-WIDE assistant (advisory only — finds & recommends hotels across the marketplace).
  - name: Internal
    description: Endpoints for an external scheduler (cron). Protected by the x-cron-secret header, not user JWT.
  - name: Admin
    description: Platform-wide admin dashboard & oversight (admin / platform_manager)
  - name: PlatformManager
    description: Platform analytics & hotel performance scoring (platform_manager / admin)
  - name: Notifications
    description: In-app notifications for the authenticated user (list, unread badge, mark read, delete)

paths:
  /conversations/messages:
    post:
      summary: Send a message to the chatbot (per-hotel or platform-wide)
      description: >
        Send one message to the AI chatbot. Authentication is OPTIONAL. Two modes selected by hotelId:
        WITH hotelId → per-hotel concierge; WITHOUT hotelId → platform-wide assistant (advisory only:
        it finds & recommends hotels across the marketplace via search_hotels, and does NOT book, cancel
        or look up orders — it invites the guest to open a hotel's page for that). In per-hotel mode,
        anonymous visitors get a read-only assistant (FAQs, room/price search, hotel info) while
        authenticated guests additionally get personal actions — look up their own bookings and
        place/cancel bookings via a two-step confirm-gate (the bot proposes a summary, then acts only
        after explicit agreement). If conversationId is omitted a new conversation is created; otherwise
        the message continues that conversation (full history replayed to the LLM each turn). An anonymous
        conversation cannot be resumed with a token and vice versa, and a platform conversation is separate
        from any hotel conversation. Returns the bot reply and the conversationId to reuse next turn.
      tags: [Chatbot]
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                hotelId:
                  type: string
                  format: uuid
                  description: Omit for the platform-wide assistant; send it for a specific hotel's concierge
                conversationId:
                  type: string
                  format: uuid
                  description: Omit to start a new conversation
                message:
                  type: string
                  maxLength: 2000
              example:
                message: Tìm giúp mình khách sạn ở Đà Nẵng cho 2 người cuối tuần này
      responses:
        "201":
          description: >
            Bot reply. handoff is a BE-computed flag: true when a human is handling the conversation
            (escalated, or active with an assigned staff) — DO NOT infer it from status alone, because
            status returns to "active" once staff reply while the bot must stay silent. When handoff is
            true, reply is a "please wait for staff" notice and the bot did not run.
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversationId:
                    type: string
                    format: uuid
                  reply:
                    type: string
                  status:
                    type: string
                    enum: [active, escalated, resolved, closed]
                  handoff:
                    type: boolean
                    description: true = a human is handling this conversation (bot stays silent)
        "401":
          description: A token was sent but is invalid/expired (refresh and retry). No token = anonymous, still allowed.
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          description: Rate limit or daily/conversation message quota exceeded

  /conversations/mine:
    get:
      summary: List the caller's conversations (one row per hotel / platform)
      description: >
        Sidebar of "which hotels have I chatted with" for an AUTHENTICATED guest (Messenger-style).
        One row per hotelId (most recent), sorted by recency; capped at 30. hotel is null for a
        platform-wide conversation. Anonymous visitors get [] (they have no durable history). Each row
        carries the BE-computed handoff flag.
      tags: [Chatbot]
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Conversation list (empty array for anonymous callers)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    hotelId: { type: string, format: uuid, nullable: true }
                    status: { type: string }
                    handoff: { type: boolean }
                    lastMessage: { type: string, nullable: true }
                    lastMessageSender: { type: string, nullable: true, description: "user | ai_bot | staff | system" }
                    lastMessageAt: { type: string, format: date-time, nullable: true }
                    hotel:
                      type: object
                      nullable: true
                      description: null = platform-wide conversation
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        city: { type: string }
                        imageUrl: { type: string, nullable: true }
        "401":
          description: A token was sent but is invalid/expired

  /conversations/me:
    get:
      summary: Restore the caller's open conversation after a refresh
      description: >
        Returns the caller's most recent conversation for the given hotelId (omit hotelId for the
        platform-wide conversation) plus the last 50 messages (oldest→newest) and the handoff flag.
        Returns null if none exists or the caller is anonymous. Without this, conversationId lives only
        in FE state, so a refresh loses it and the guest can no longer re-join the socket room to receive
        the staff's replies.
      tags: [Chatbot]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - in: query
          name: hotelId
          required: false
          schema: { type: string, format: uuid }
          description: Omit for the platform-wide conversation
      responses:
        "200":
          description: The conversation with messages + handoff, or null
          content:
            application/json:
              schema:
                type: object
                nullable: true
        "401":
          description: A token was sent but is invalid/expired

  /conversations/{conversationId}/mode:
    patch:
      summary: Toggle a conversation between AI and human (guest-driven)
      description: >
        The guest flips their OWN conversation between the AI bot and a human agent. mode=human escalates
        (status→escalated, appends a "[Hệ thống] <reason>" system message, notifies the hotel's staff
        mailbox in real time) — rejected with 400 for a platform-wide conversation (no hotel = no staff to
        handle it). mode=ai returns it to the bot (status→active, clears assignedTo, appends a system note)
        — unlike staff Resolve, it does NOT mark the conversation resolved. Flipping to the current mode is
        a no-op (safe to press repeatedly). The conversation is never recreated, so history is preserved.
        404 if the conversation is not the caller's.
      tags: [Chatbot]
      security:
        - bearerAuth: []
        - {}
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [ai, human] }
                reason: { type: string, maxLength: 500, description: "Used when mode=human" }
              example:
                mode: human
                reason: Khách yêu cầu gặp nhân viên
      responses:
        "200":
          description: Updated conversation record + handoff flag
        "400":
          description: mode=human on a platform-wide conversation (no hotel/staff)
        "401":
          description: A token was sent but is invalid/expired
        "404":
          $ref: '#/components/responses/NotFound'

  /conversations/messages/stream:
    post:
      summary: Send a message and stream the reply (SSE)
      description: >
        Same body and OPTIONAL-auth behaviour as /conversations/messages (omit hotelId = platform-wide
        advisory assistant, send hotelId = per-hotel concierge; anonymous = read-only, authenticated =
        personal booking actions in per-hotel mode), but the reply is streamed token-by-token over
        Server-Sent Events. Emits a "meta" event { conversationId, status, handoff } (status/handoff here
        may be STALE — the bot can escalate mid-turn), then "chunk" events { text }, then a "done" event
        { status, handoff } carrying the AUTHORITATIVE post-turn state — trust this one. The full reply is
        saved to the DB after streaming ends.
      tags: [Chatbot]
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                hotelId:
                  type: string
                  format: uuid
                  description: Omit for the platform-wide assistant; send it for a specific hotel's concierge
                conversationId:
                  type: string
                  format: uuid
                message:
                  type: string
                  maxLength: 2000
      responses:
        "200":
          description: SSE stream (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: '#/components/responses/NotFound'
        "429":
          description: Rate limit or daily/conversation message quota exceeded

  /admin/overview:
    get:
      summary: Platform overview dashboard (admin)
      description: >
        Admin/platform_manager (viewPlatformStats) gets platform metrics computed live in one
        consistent transaction: user counts by role, hotels listed/unlisted, bookings by status, and
        revenue (GMV, platform commission pending/settled, total refunded). Money values are strings.
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Aggregated platform metrics
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /admin/revenue:
    get:
      summary: Platform revenue report (admin/platform_manager)
      description: >
        viewPlatformStats. Platform-wide revenue over [from, to], on a single recognition-date basis:
        GMV (sum of totalAmount of bookings recognized by PAYMENT date — commission.createdAt),
        commission pending/settled/disputed, total refunded, and netPlatformRevenue
        (= pending + settled commission — the platform's actual earnings).
        `refunded` counts ONLY refunds already in status 'processed' (money has actually left),
        dated by refund request date; pending/rejected requests are not refunds.
        Includes a day/month time series and, when BOTH from and to are given, a % comparison against
        the immediately preceding period of equal length. All money values are strings.
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
          description: Inclusive start date (YYYY-MM-DD). Omit for all-time (comparison then null).
        - in: query
          name: to
          schema: { type: string, format: date }
          description: Inclusive end date (YYYY-MM-DD). Omit for all-time.
        - in: query
          name: groupBy
          schema: { type: string, enum: [day, month], default: month }
      responses:
        "200":
          description: Platform revenue summary + time series + period comparison
          content:
            application/json:
              schema:
                type: object
                properties:
                  currency: { type: string, example: 'VND' }
                  asOf:
                    type: string
                    format: date-time
                    description: When these figures were computed.
                  summary:
                    type: object
                    properties:
                      gmv: { type: string, example: '125000000' }
                      commissionPending: { type: string, example: '5000000' }
                      commissionSettled: { type: string, example: '13750000' }
                      commissionDisputed:
                        type: string
                        example: '500000'
                        description: Excluded from netPlatformRevenue; returned so disputes stay visible.
                      refunded: { type: string, example: '2000000' }
                      netPlatformRevenue: { type: string, example: '18750000' }
                      bookingCount: { type: integer, example: 250 }
                      takeRatePct:
                        type: number
                        nullable: true
                        example: 15
                        description: netPlatformRevenue / gmv × 100. null when there is no GMV yet.
                      avgBookingValue:
                        type: string
                        nullable: true
                        example: '500000.00'
                        description: gmv / bookingCount. null when no booking was recognized.
                  groupBy: { type: string, example: month }
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        period: { type: string, example: '2026-07' }
                        gmv: { type: string }
                        commission: { type: string }
                        netPlatformRevenue: { type: string }
                        bookingCount: { type: integer }
                  comparison:
                    nullable: true
                    description: Present only when both from and to are supplied; otherwise null.
                    type: object
                    properties:
                      previous:
                        type: object
                        properties:
                          gmv: { type: string }
                          netPlatformRevenue: { type: string }
                      change:
                        type: object
                        properties:
                          gmvPct: { type: number, nullable: true, example: 12.5 }
                          netRevenuePct: { type: number, nullable: true, example: 8.3 }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /admin/revenue/breakdown:
    get:
      summary: Revenue breakdown by partner / hotel / city (admin & platform manager)
      description: >
        Requires `viewPlatformStats`. Detailed revenue for EACH partner, hotel, or city — the drill-down
        for `/admin/revenue` (which only gives the platform total). Same recognition basis: `gmv` +
        `commission` by PAYMENT date (commission.createdAt), `refunded` by refund request date and
        limited to refunds already 'processed'.
        `commission` is the platform's actual revenue for that group (excludes 'disputed'). The sum of
        every group's `gmv`/`commission`/`refunded` equals the `/admin/revenue` total for the same range.


        `commissionRatePct` is the booking-value-weighted average commission rate actually charged in
        the period, taken from the rate frozen on each commission record. Do NOT derive it as
        `commission / gmv`: a refund recomputes `commission_amount` while `total_amount` stays put, so
        the two have different denominators. For the same reason `gmv × commissionRatePct` need not
        equal `commission` — the rate includes 'disputed' records, `commission` excludes them.


        Drill flow: `groupBy=partner` (list all partners) → click one → `groupBy=hotel&partnerId=` (that
        partner's hotels) → click a hotel → `GET /hotels/{id}/revenue` (per-hotel detail + time series,
        already accessible to platform managers). All money values are strings.
      tags: [Revenue]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: groupBy
          required: true
          schema: { type: string, enum: [partner, hotel, city] }
        - in: query
          name: from
          schema: { type: string, format: date }
          description: Inclusive start date (YYYY-MM-DD). Omit for all-time.
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: partnerId
          schema: { type: string, format: uuid }
          description: Drill-down filter — with groupBy=hotel, only that partner's hotels.
        - in: query
          name: sortBy
          schema: { type: string, enum: [commission, gmv, bookingCount], default: commission }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200":
          description: Paginated breakdown. Row fields depend on groupBy.
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupBy: { type: string, enum: [partner, hotel, city] }
                  currency: { type: string, example: 'VND' }
                  asOf:
                    type: string
                    format: date-time
                    description: When these figures were computed.
                  totals:
                    type: object
                    description: >
                      Totals across EVERY group in the range, not just the current page — use these for
                      share-of-total columns and pie charts. `refunded` only counts groups that appear
                      in `results` for the range.
                    properties:
                      gmv: { type: string, example: '125000000' }
                      commission: { type: string, example: '18750000' }
                      refunded: { type: string, example: '2000000' }
                      bookingCount: { type: integer, example: 250 }
                  results:
                    type: array
                    description: >
                      Every row carries gmv, commission, commissionRatePct, refunded, bookingCount and
                      sharePct. Identity fields differ by groupBy —
                      partner → { partnerId, name, hotelCount };
                      hotel → { hotelId, name, city, partnerId, partnerName };
                      city → { city, hotelCount }
                    items:
                      type: object
                      properties:
                        partnerId: { type: string, nullable: true }
                        hotelId: { type: string, nullable: true }
                        city: { type: string, nullable: true }
                        name: { type: string, nullable: true }
                        partnerName: { type: string, nullable: true }
                        gmv: { type: string, example: '20638000.00' }
                        commission: { type: string, example: '3095700.00' }
                        commissionRatePct:
                          type: string
                          example: '15.00'
                          description: >
                            Booking-value-weighted average commission rate charged in the period.
                            '0' when the group has no booking value to weigh.
                        refunded: { type: string, example: '0' }
                        bookingCount: { type: integer, example: 5 }
                        hotelCount: { type: integer, nullable: true, example: 1 }
                        sharePct:
                          type: number
                          example: 16.51
                          description: This group's share of totals.commission, in percent.
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
                  totalResults: { type: integer }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /admin/commissions:
    get:
      summary: List platform commissions (admin)
      description: >
        Admin/platform_manager (manageCommissions) lists platform commission records, filtered by
        status (pending/settled/disputed) and partner. Each item includes the partner and booking.
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, settled, disputed]
        - in: query
          name: partnerId
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Paginated commissions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedCommissions' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /admin/hotels:
    get:
      summary: List all hotels platform-wide (admin)
      description: >
        Admin/platform_manager (manageHotels) lists ALL hotels including unlisted / suspended ones,
        filtered by isListed, isActive and a name/city search. Each item includes the owning partner.
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: isListed
          schema:
            type: boolean
        - in: query
          name: isActive
          schema:
            type: boolean
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Paginated hotels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedAdminHotels' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /admin/hotels/{hotelId}:
    patch:
      summary: Toggle a hotel's listing / active flags (admin)
      description: >
        Admin/platform_manager (manageHotels) approves/delists (isListed) or suspends/reactivates
        (isActive) a hotel. Send at least one flag. Writes an audit log entry.
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                isListed:
                  type: boolean
                isActive:
                  type: boolean
              example:
                isListed: false
      responses:
        "200":
          description: Updated hotel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hotel' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /platform-manager/partners:
    get:
      summary: List all hotel partners (Platform Manager)
      description: >
        Platform_manager/admin (viewPlatformStats). Lists every hotel partner platform-wide, filtered by
        status and a name/email search. Each item includes the owner account and the partner's hotel count.
      tags: [PlatformManager]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, suspended, rejected] }
        - in: query
          name: search
          schema: { type: string }
          description: Match businessName or contactEmail
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Paginated partner list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedPartners' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform-manager/bookings:
    get:
      summary: List all platform bookings (Platform Manager)
      description: >
        Platform_manager/admin (viewPlatformStats). Lists every booking platform-wide, filtered by status,
        hotel, partner and check-in date range, plus a search over booking code / customer name / email.
      tags: [PlatformManager]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, confirmed, checked_in, checked_out, cancelled, no_show] }
        - in: query
          name: hotelId
          schema: { type: string, format: uuid }
        - in: query
          name: partnerId
          schema: { type: string, format: uuid }
          description: Narrow to bookings of one partner's hotels
        - in: query
          name: fromDate
          schema: { type: string, format: date }
        - in: query
          name: toDate
          schema: { type: string, format: date }
        - in: query
          name: search
          schema: { type: string }
          description: Match bookingCode / customer fullName / customer email
        - in: query
          name: sortBy
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Paginated platform bookings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedOversightBookings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform-manager/analytics:
    get:
      summary: Platform analytics report (Platform Manager)
      description: >
        Platform_manager/admin (viewPlatformStats). Totals (bookings, users, conversion rate =
        confirmed/total), a month/year time-series for comparison, and top cities / top hotels by bookings.
      tags: [PlatformManager]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: period
          schema: { type: string, enum: [month, year] }
          description: Time-series bucket (default month)
        - in: query
          name: range
          schema: { type: integer, minimum: 1, maximum: 36 }
          description: Number of recent buckets (default 12 months / 5 years)
        - in: query
          name: topLimit
          schema: { type: integer, minimum: 1, maximum: 20 }
          description: Max items for top city / top hotel lists (default 5)
      responses:
        '200':
          description: Platform analytics report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformAnalytics' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform-manager/performance:
    get:
      summary: Hotel performance leaderboard (Platform Manager)
      description: >
        Platform_manager/admin (viewPlatformStats). Ranks all hotels by composite performance score
        over a window (default last 90 days). Hotels lacking data are placed last.
      tags: [PlatformManager]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: Hotels ranked by score
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerformanceLeaderboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform-manager/hotels/{hotelId}/performance:
    get:
      summary: One hotel's performance & score (Platform Manager)
      description: >
        Platform_manager/admin (viewPlatformStats). occupancyRate, cancellationRate, avgRating,
        avgResponseMinutes and a weighted composite score (rating 40% / occupancy 25% / cancel 20% /
        response 15%) for one hotel over a window (default last 90 days).
      tags: [PlatformManager]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: Hotel performance and score
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HotelPerformance' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/audit-logs:
    get:
      summary: List audit logs (admin)
      description: >
        Admin/platform_manager (viewPlatformStats) lists audit log entries written on sensitive actions
        (user status/role change, commission settle, hotel flag change), filtered by action, entityType
        and actor. Each entry includes the acting user.
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: action
          schema:
            type: string
        - in: query
          name: entityType
          schema:
            type: string
        - in: query
          name: userId
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Paginated audit logs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedAuditLogs' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'

  /internal/jobs/release-holds:
    post:
      summary: Release expired booking holds (cron)
      description: >
        Called by an external scheduler (e.g. cron-job.org) on a schedule (suggested every 5 minutes).
        Cancels pending bookings whose 15-minute payment hold expired and returns their inventory.
        Protected by the x-cron-secret header (not user JWT). Idempotent — safe to call repeatedly.
      tags: [Internal]
      parameters:
        - in: header
          name: x-cron-secret
          required: true
          schema:
            type: string
          description: Must equal the server's CRON_SECRET
      responses:
        "200":
          description: Number of holds released
          content:
            application/json:
              schema:
                type: object
                properties:
                  released:
                    type: integer
        "401":
          description: Missing or wrong cron secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /internal/jobs/sweep-no-shows:
    post:
      summary: Mark elapsed confirmed bookings as no-show (cron)
      description: >
        Called by an external scheduler (suggested hourly). Marks confirmed bookings whose stay window
        has fully elapsed without check-in as no_show. Protected by x-cron-secret. Idempotent.
      tags: [Internal]
      parameters:
        - in: header
          name: x-cron-secret
          required: true
          schema:
            type: string
          description: Must equal the server's CRON_SECRET
      responses:
        "200":
          description: Number of bookings marked no-show
          content:
            application/json:
              schema:
                type: object
                properties:
                  noShow:
                    type: integer
        "401":
          description: Missing or wrong cron secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /internal/jobs/settle-commissions:
    post:
      summary: Auto-settle eligible commissions (cron)
      description: >
        Called by an external scheduler (suggested daily). Settles every pending commission whose
        booking has checked out and passed the reconciliation hold period, moving the hotel's net from
        the wallet's pending to available balance. Protected by x-cron-secret. Idempotent — conditional
        updates prevent double-settlement.
      tags: [Internal]
      parameters:
        - in: header
          name: x-cron-secret
          required: true
          schema:
            type: string
          description: Must equal the server's CRON_SECRET
      responses:
        "200":
          description: Number of commissions settled
          content:
            application/json:
              schema:
                type: object
                properties:
                  settled:
                    type: integer
        "401":
          description: Missing or wrong cron secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /internal/jobs/auto-approve-refunds:
    post:
      summary: Auto-approve refund requests the hotel ignored (cron)
      description: >
        Runs nightly (04:00 Asia/Ho_Chi_Minh) inside the app; this endpoint only forces it to run now.
        Approves every refund request left `pending` for more than 3 days.


        Why it must exist: the refund amount comes from the hotel's OWN published cancellation policy,
        so reviewing is meant for exceptions, not a veto. Without a deadline a hotel could simply stay
        silent and the guest would never get their money.


        Auto-approved requests are marked by `reviewedAt` set with `reviewedBy: null` — nobody clicked.
        Protected by x-cron-secret. Idempotent.
      tags: [Internal]
      parameters:
        - in: header
          name: x-cron-secret
          required: true
          schema:
            type: string
          description: Must equal the server's CRON_SECRET
      responses:
        "200":
          description: Number of requests auto-approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  approved:
                    type: integer
        "401":
          description: Missing or wrong cron secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /internal/jobs/credit-wallet-refunds:
    post:
      summary: Credit approved wallet refunds to guests (cron)
      description: >
        Runs nightly (04:10, right after auto-approve-refunds); this endpoint only forces it to run now.
        Credits every refund that is `approved` with `refundMethod: wallet` and moves it to `processed`.


        Why it must exist: a refund approved by a human goes through reviewRefund, which credits the
        wallet on the spot. But requests auto-approved by the cron never pass through there — and wallet
        refunds need no Platform Manager, so without this job they would sit on `approved` forever.


        Protected by x-cron-secret. Idempotent — only picks up refunds still on `approved`.
      tags: [Internal]
      parameters:
        - in: header
          name: x-cron-secret
          required: true
          schema:
            type: string
          description: Must equal the server's CRON_SECRET
      responses:
        "200":
          description: Number of refunds credited to guest wallets
          content:
            application/json:
              schema:
                type: object
                properties:
                  credited:
                    type: integer
        "401":
          description: Missing or wrong cron secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /internal/jobs/sync-room-status:
    post:
      summary: Re-derive rooms.status for the current day (cron)
      description: >
        Runs daily at 00:05; this endpoint only forces it to run now. Recomputes the display label
        of every room that either has a block in force today or is currently labelled `maintenance`.


        Why it must exist: `syncDisplayStatus` only fires when somebody touches a room (housekeeping
        change, block created, block resolved), but blocks have date ranges. Schedule a block for
        tomorrow and tomorrow the column still says `available` until someone happens to touch that
        room — every screen reading `rooms.status`, including the room picker at check-in, is then
        wrong and nothing says so.


        Protected by x-cron-secret. Scans by data condition rather than "did it run today", so a
        missed or doubled run is harmless.
      tags: [Internal]
      parameters:
        - in: header
          name: x-cron-secret
          required: true
          schema:
            type: string
          description: Must equal the server's CRON_SECRET
      responses:
        "200":
          description: Number of rooms whose label actually changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  synced:
                    type: integer
        "401":
          description: Missing or wrong cron secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/send-otp:
    post:
      summary: Send OTP verification code
      description: Generates a 6-digit verification code and emails it to the user.
      tags: [Auth]
      requestBody:
        required: true
        content:
