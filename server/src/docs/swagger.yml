tags:
  - name: Auth
    description: Authentication
  - name: Users
    description: User management and retrieval
  - name: Uploads
    description: File upload (Cloudinary)
  - name: HotelPartners
    description: Hotel partner registration and verification
  - name: Hotels
    description: Public hotel & room search
  - name: Bookings
    description: Booking creation, cancellation and listing
  - name: HotelManagement
    description: Partner management of room types, rooms and pricing rules (hotel owner or manageHotels right)
  - name: Amenities
    description: Amenity catalog (list public, create admin-only)

paths:
  /auth/send-otp:
    post:
      summary: Send OTP verification code
      description: Generates a 6-digit verification code and emails it to the user.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
              example:
                email: khiembadinh987@gmail.com
      responses:
        '200':
          description: OTP Sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  message:
                    type: string
                    example: Verification OTP sent successfully to khiembadinh987@gmail.com
        '400':
          description: Email already taken or invalid format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register:
    post:
      summary: Register as user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                  description: must be unique
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: At least one number and one letter
              example:
                name: fake name
                email: fake@example.com
                password: password1
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  tokens:
                    $ref: '#/components/schemas/AuthTokens'
        '400':
          $ref: '#/components/responses/DuplicateEmail'

  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              example:
                email: fake@example.com
                password: password1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  tokens:
                    $ref: '#/components/schemas/AuthTokens'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: Invalid email or password

  /auth/logout:
    post:
      summary: Logout
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
              example:
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1ZWJhYzUzNDk1NGI1NDEzOTgwNmMxMTIiLCJpYXQiOjE1ODkyOTg0ODQsImV4cCI6MTU4OTMwMDI4NH0.m1U63blB0MLej_WfB7yC2FTMnCziif9X8yzwDEfJXAg
      responses:
        '204':
          description: No content
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/refresh-tokens:
    post:
      summary: Refresh auth tokens
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
              example:
                refreshToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1ZWJhYzUzNDk1NGI1NDEzOTgwNmMxMTIiLCJpYXQiOjE1ODkyOTg0ODQsImV4cCI6MTU4OTMwMDI4NH0.m1U63blB0MLej_WfB7yC2FTMnCziif9X8yzwDEfJXAg
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokens'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/forgot-password:
    post:
      summary: Forgot password
      description: An email will be sent to reset password.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
              example:
                email: fake@example.com
      responses:
        '204':
          description: No content
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/reset-password:
    post:
      summary: Reset password
      tags: [Auth]
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: The reset password token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: At least one number and one letter
              example:
                password: password1
      responses:
        '204':
          description: No content
        '401':
          description: Password reset failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: Password reset failed

  /auth/send-verification-email:
    post:
      summary: Send verification email
      description: An email will be sent to verify email.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/verify-email:
    post:
      summary: verify email
      tags: [Auth]
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
          description: The verify email token
      responses:
        '204':
          description: No content
        '401':
          description: verify email failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: 401
                message: verify email failed

  /users:
    post:
      summary: Create a user
      description: Only admins can create other users.
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - role
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                  description: must be unique
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: At least one number and one letter
                role:
                  type: string
                  enum: [user, admin]
              example:
                name: fake name
                email: fake@example.com
                password: password1
                role: user
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/DuplicateEmail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      summary: Get all users
      description: Only admins can retrieve all users.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: name
          schema:
            type: string
          description: User name
        - in: query
          name: role
          schema:
            type: string
          description: User role
        - in: query
          name: sortBy
          schema:
            type: string
          description: sort by query in the form of field:desc/asc (ex. name:asc)
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
          default: 10
          description: Maximum number of users
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
                  totalPages:
                    type: integer
                    example: 1
                  totalResults:
                    type: integer
                    example: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /users/{id}:
    get:
      summary: Get a user
      description: Logged in users can fetch only their own user information. Only admins can fetch other users.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: User id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update a user
      description: Logged in users can only update their own information. Only admins can update other users.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: User id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                  description: must be unique
                password:
                  type: string
                  format: password
                  minLength: 8
                  description: At least one number and one letter
              example:
                name: fake name
                email: fake@example.com
                password: password1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/DuplicateEmail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      summary: Delete a user
      description: Logged in users can delete only themselves. Only admins can delete other users.
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: User id
      responses:
        '200':
          description: No content
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /uploads:
    post:
      summary: Upload a file to Cloudinary
      description: Uploads a single image/PDF (multipart field "file") and returns its public URL.
      tags: [Uploads]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: folder
          schema:
            type: string
            enum: [licenses, representatives, properties, documents]
          description: Cloudinary sub-folder to group the file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: https://res.cloudinary.com/demo/image/upload/v1/smartstay/licenses/abc.jpg
                  publicId:
                    type: string
                    example: smartstay/licenses/abc
        '400':
          description: No file uploaded or invalid file type/size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /hotel-partners/registrations:
    post:
      summary: Submit a hotel partner registration
      description: >
        Creates a HotelPartner (pending), a Hotel (not yet active), its licenses, representative,
        images, payout account and a pending verification request — all in one transaction.
        Any authenticated user can submit. File URLs must be uploaded via POST /uploads first.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelRegistrationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationRequest'
        '400':
          description: Validation error or duplicate pending/approved partner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      summary: List verification requests (platform manager)
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_review, approved, rejected]
        - in: query
          name: sortBy
          schema:
            type: string
          description: 'field:(desc|asc) e.g. submittedAt:desc'
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/HotelVerificationRequestSummary'
                  page: { type: integer, example: 1 }
                  limit: { type: integer, example: 10 }
                  totalPages: { type: integer, example: 1 }
                  totalResults: { type: integer, example: 1 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /hotel-partners/registrations/me:
    get:
      summary: List my own verification requests
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HotelVerificationRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /hotel-partners/registrations/{requestId}:
    get:
      summary: Get a verification request by id
      description: Accessible by the owner or a platform manager.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotel-partners/registrations/{requestId}/review:
    patch:
      summary: Approve or reject a verification request (platform manager)
      description: >
        On approve - partner becomes approved, the owner user's role is upgraded to hotel_partner,
        the hotel is activated but NOT yet published (isListed=false), RoomType + Room records are
        seeded from the declared roomConfig (rooms inactive until the partner completes details and
        publishes in Room Inventory), and the partner receives a 'partner_approved' notification.
        On reject - a rejectionReason is required.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                rejectionReason:
                  type: string
                  description: Required when decision is "reject"
      responses:
        '200':
          description: Reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationRequest'
        '400':
          description: Already reviewed or invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotel-partners/documents/{documentId}/review:
    patch:
      summary: Approve or reject a single document (platform manager)
      description: >
        Fine-grained review (Hướng B). On approve, if the document type is also a license type,
        the matching license's current_document_id is set to this document.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
      responses:
        '200':
          description: Reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotels:
    get:
      summary: Search hotels by city (with availability check)
      description: >
        Public. Returns active & listed hotels. When checkIn/checkOut are provided (they must go
        together), only hotels with at least one room type available for every night of the stay
        are returned. Each result includes minPrice (lowest base price among matching room types).
      tags: [Hotels]
      parameters:
        - in: query
          name: city
          schema:
            type: string
          description: Case-insensitive partial match
        - in: query
          name: checkIn
          schema:
            type: string
            format: date
        - in: query
          name: checkOut
          schema:
            type: string
            format: date
          description: Must be after checkIn
        - in: query
          name: guests
          schema:
            type: integer
            minimum: 1
          description: Only hotels having a room type with maxOccupancy >= guests
        - in: query
          name: sortBy
          schema:
            type: string
          description: 'field:(desc|asc) e.g. starRating:desc'
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: Paginated hotel list ({ results, page, limit, totalPages, totalResults })
        '400':
          description: Invalid query (e.g. checkIn without checkOut)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /hotels/{userId}:
    get:
      summary: List hotels owned by a partner
      description: >
        Returns every hotel owned by the given user (partner), including unlisted/pending ones
        (soft-deleted excluded) — for the partner's Hotel Management screen. Auth: the owner
        themselves (path userId must equal the token user) OR a user with the manageHotels right
        (platform_manager/admin). Each item includes the cover image and a count of room types and rooms.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
          description: Owner (partner) user id
      responses:
        "200": { description: "Array of hotels (each with primary image + _count of roomTypes/rooms)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /hotels/{hotelId}/room-types:
    get:
      summary: Search room types within a hotel (with filters)
      description: >
        Public. Filters by capacity, price range, bed type and view type. When checkIn/checkOut
        are provided, each room type includes numNights, availableRooms and totalPrice for the
        stay (per-night priceOverride applied), and sold-out room types are excluded.
      tags: [Hotels]
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: checkIn
          schema:
            type: string
            format: date
        - in: query
          name: checkOut
          schema:
            type: string
            format: date
        - in: query
          name: guests
          schema:
            type: integer
            minimum: 1
        - in: query
          name: minPrice
          schema:
            type: number
        - in: query
          name: maxPrice
          schema:
            type: number
        - in: query
          name: bedType
          schema:
            type: string
        - in: query
          name: viewType
          schema:
            type: string
      responses:
        '200':
          description: Room types with images & amenities (plus availability and total price when dates given)
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings:
    post:
      summary: Create a booking
      description: >
        Authenticated customers book one room of a room type for [checkInDate, checkOutDate).
        Prices are computed server-side (per-night priceOverride if set, else basePrice).
        Inventory is reserved per night inside a transaction, so concurrent bookings cannot
        oversell. Booking is created with status "pending" (payment flow is separate).
      tags: [Bookings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hotelId
                - roomTypeId
                - checkInDate
                - checkOutDate
                - numGuests
              properties:
                hotelId:
                  type: string
                  format: uuid
                roomTypeId:
                  type: string
                  format: uuid
                checkInDate:
                  type: string
                  format: date
                checkOutDate:
                  type: string
                  format: date
                  description: Must be after checkInDate (max 30 nights)
                numGuests:
                  type: integer
                  minimum: 1
                specialRequests:
                  type: string
              example:
                hotelId: 11111111-1111-1111-1111-111111111111
                roomTypeId: 22222222-2222-2222-2222-222222222222
                checkInDate: '2026-07-01'
                checkOutDate: '2026-07-03'
                numGuests: 2
      responses:
        '201':
          description: Booking created (includes bookingCode, totals, hotel & roomType summary)
        '400':
          description: Sold out for a night, past check-in date, or capacity exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings/me:
    get:
      summary: List my bookings
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, checked_in, checked_out, cancelled, no_show]
        - in: query
          name: sortBy
          schema:
            type: string
          description: 'field:(desc|asc) e.g. createdAt:desc'
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: Paginated booking list ({ results, page, limit, totalPages, totalResults })
        '401':
          $ref: '#/components/responses/Unauthorized'

  /bookings/{bookingId}:
    get:
      summary: Get a booking by id
      description: Accessible by the booking owner or a user with the manageBookings right.
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings/{bookingId}/cancel:
    patch:
      summary: Cancel a booking
      description: >
        Owner (or manageBookings) cancels a pending/confirmed booking before its check-in date.
        Reserved inventory is released for every night of the stay.
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Booking cancelled
        '400':
          description: Not cancellable (wrong status or check-in date reached)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/room-types/manage:
    get:
      summary: List room types for management (includes inactive)
      description: Hotel owner or manageHotels. Each item includes images, amenities and physical room count.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/room-types/create:
    post:
      summary: Create a room type (actual path is POST /hotels/{hotelId}/room-types)
      description: >
        Hotel owner or manageHotels. NOTE - the real path is POST /hotels/{hotelId}/room-types
        (documented here separately because the GET on that path is the public search).
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, maxOccupancy, basePrice]
              properties:
                name: { type: string }
                description: { type: string }
                maxOccupancy: { type: integer, minimum: 1, maximum: 20 }
                basePrice: { type: number, minimum: 0 }
                areaSqm: { type: number }
                bedType: { type: string }
                viewType: { type: string }
                isActive: { type: boolean, default: true }
              example:
                name: Phòng Deluxe Twin
                maxOccupancy: 3
                basePrice: 1200000
                bedType: twin
                viewType: city
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/room-types/{roomTypeId}:
    put:
      summary: Update a room type
      description: Hotel owner or manageHotels. All fields optional; set isActive=false to stop selling.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: roomTypeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                maxOccupancy: { type: integer }
                basePrice: { type: number }
                areaSqm: { type: number }
                bedType: { type: string }
                viewType: { type: string }
                isActive: { type: boolean }
      responses:
        '200': { description: Updated }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/room-types/{roomTypeId}/images:
    post:
      summary: Add images to a room type
      description: >
        URLs must be uploaded via POST /uploads first. If any new image has isPrimary=true,
        the previous primary flag is cleared so there is always at most one primary image.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: roomTypeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [url]
                    properties:
                      url: { type: string, format: uri }
                      isPrimary: { type: boolean }
                      sortOrder: { type: integer }
      responses:
        '201': { description: Full image list of the room type }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/room-types/{roomTypeId}/amenities:
    put:
      summary: Set room type amenities (replace all, N-N)
      description: The sent list REPLACES the current amenity set; an empty array clears all amenities.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: roomTypeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amenityIds]
              properties:
                amenityIds:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200': { description: Room type with the new amenity set }
        '400': { description: Some amenity ids do not exist }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/rooms:
    post:
      summary: Create a physical room
      description: >
        Room number must be unique within the hotel. Future room_availability rows of the
        room type get totalRooms incremented so already-priced nights sell the new room too.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomTypeId, roomNumber]
              properties:
                roomTypeId: { type: string, format: uuid }
                roomNumber: { type: string }
                floor: { type: integer }
                status: { type: string, enum: [available, occupied, maintenance, cleaning], default: available }
                notes: { type: string }
      responses:
        '201': { description: Created }
        '400': { description: Duplicate room number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      summary: List physical rooms (filter by status, room type)
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [available, occupied, maintenance, cleaning] }
        - in: query
          name: roomTypeId
          schema: { type: string, format: uuid }
        - in: query
          name: sortBy
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer }
      responses:
        '200': { description: Paginated room list }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/rooms/{roomId}:
    put:
      summary: Update a room (status, number, floor, notes)
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: roomId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roomNumber: { type: string }
                floor: { type: integer }
                status: { type: string, enum: [available, occupied, maintenance, cleaning] }
                notes: { type: string }
              example:
                status: maintenance
                notes: Hỏng điều hoà, chờ linh kiện
      responses:
        '200': { description: Updated }
        '400': { description: Duplicate room number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/pricing-rules:
    post:
      summary: Create a pricing rule
      description: >
        roomTypeId null/omitted = rule applies to the whole hotel. Matching nights get the
        highest-priority rule applied on top of (priceOverride ?? basePrice). early_bird rules
        match when TODAY (booking time) is inside [startDate, endDate]; other types match the
        stay night. occupancy rules require occupancyThreshold (% booked) and fire when the
        night's occupancy reaches it. adjustmentValue can be negative (discount).
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, ruleType, startDate, endDate, adjustmentType, adjustmentValue]
              properties:
                roomTypeId: { type: string, format: uuid, nullable: true }
                name: { type: string }
                ruleType: { type: string, enum: [seasonal, weekend, occupancy, early_bird] }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                dayOfWeek:
                  type: array
                  items: { type: integer, minimum: 0, maximum: 6 }
                  description: 0=Sunday..6=Saturday; empty = every day
                occupancyThreshold: { type: integer, minimum: 1, maximum: 100 }
                adjustmentType: { type: string, enum: [percentage, fixed] }
                adjustmentValue: { type: number, description: negative = discount }
                priority: { type: integer, default: 0 }
                isActive: { type: boolean, default: true }
              example:
                name: Phụ thu cuối tuần
                ruleType: weekend
                startDate: '2026-06-01'
                endDate: '2026-08-31'
                dayOfWeek: [5, 6]
                adjustmentType: percentage
                adjustmentValue: 20
                priority: 10
      responses:
        '201': { description: Created }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      summary: List pricing rules of a hotel
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: roomTypeId
          schema: { type: string, format: uuid }
        - in: query
          name: isActive
          schema: { type: boolean }
      responses:
        '200': { description: Rules ordered by priority desc }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/pricing-rules/{ruleId}:
    put:
      summary: Update a pricing rule
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: ruleId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any subset of the create fields
      responses:
        '200': { description: Updated }
        '400': { description: endDate before startDate after merge }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete a pricing rule
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: ruleId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /amenities:
    get:
      summary: List all amenities
      description: Public. Optional category filter (room/hotel/service).
      tags: [Amenities]
      parameters:
        - in: query
          name: category
          schema: { type: string, enum: [room, hotel, service] }
      responses:
        '200': { description: OK }
    post:
      summary: Create an amenity (admin only)
      description: Requires the manageAmenities right (admin). Name is globally unique.
      tags: [Amenities]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name: { type: string }
                icon: { type: string }
                category: { type: string, enum: [room, hotel, service] }
              example:
                name: Máy pha cà phê
                icon: coffee
                category: room
      responses:
        '201': { description: Created }
        '400': { description: Duplicate name }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hotel-partners/documents/{documentId}/replace:
    post:
      summary: Re-upload a rejected document (owner)
      description: The partner who owns the document submits a new file URL; a new pending document is created and the old one is marked replaced.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileUrl
              properties:
                fileUrl:
                  type: string
                  format: uri
      responses:
        '201':
          description: Replacement document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationDocument'
        '400':
          description: Document is not in a rejected state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
