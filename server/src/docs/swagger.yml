      responses:
        '200':
          description: Room types (active + inactive) with images, amenities and room count
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoomType' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/room-types/create:
    post:
      summary: Create a room type (actual path is POST /hotels/{hotelId}/room-types)
      description: >
        Hotel owner or manageHotels. NOTE - the real path is POST /hotels/{hotelId}/room-types
        (documented here separately because the GET on that path is the public search).
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, maxOccupancy, basePrice]
              properties:
                name: { type: string }
                description: { type: string }
                maxOccupancy: { type: integer, minimum: 1, maximum: 20 }
                basePrice: { type: number, minimum: 0 }
                areaSqm: { type: number }
                bedType: { type: string }
                viewType: { type: string }
                isActive: { type: boolean, default: true }
                maxAdults: { type: integer, minimum: 0, maximum: 20 }
                maxChildren: { type: integer, minimum: 0, maximum: 20 }
                sizeUnit: { type: string, enum: [sqm, sqft] }
                isNonSmoking: { type: boolean }
                hasPrivateBathroom: { type: boolean }
                hasBalcony: { type: boolean }
              example:
                name: Phòng Deluxe Twin
                maxOccupancy: 3
                basePrice: 1200000
                bedType: twin
                viewType: city
      responses:
        '201':
          description: Created room type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/room-types/{roomTypeId}:
    get:
      summary: Get one room type detail (guest)
      description: >
        Public. Returns full detail of a single active room type belonging to a listed hotel
        (hotel isActive + isListed) — images, amenities, beds and minimal hotel info. When
        checkIn/checkOut are provided the response also includes numNights, availableRooms and
        totalPrice for the stay (per-night priceOverride applied). Returns 404 if the room type
        is hidden or belongs to a hotel that is not on sale.
      tags: [Hotels]
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: roomTypeId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: checkIn
          schema: { type: string, format: date }
        - in: query
          name: checkOut
          schema: { type: string, format: date }
      responses:
        '200':
          description: Room type detail (plus availability and total price when dates given)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomType' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update a room type
      description: Hotel owner or manageHotels. All fields optional; set isActive=false to stop selling.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: roomTypeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                maxOccupancy: { type: integer }
                basePrice: { type: number }
                areaSqm: { type: number }
                bedType: { type: string }
                viewType: { type: string }
                isActive: { type: boolean }
                maxAdults: { type: integer, minimum: 0, maximum: 20 }
                maxChildren: { type: integer, minimum: 0, maximum: 20 }
                sizeUnit: { type: string, enum: [sqm, sqft] }
                isNonSmoking: { type: boolean }
                hasPrivateBathroom: { type: boolean }
                hasBalcony: { type: boolean }
      responses:
        '200':
          description: Updated room type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete a room type (only if unused)
      description: >
        Hotel owner or manageHotels. Allowed only when the room type has no rooms and no bookings;
        otherwise 400 — disable it via PUT with isActive=false instead.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: roomTypeId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '400':
          description: Room type has rooms or bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/room-types/{roomTypeId}/images:
    post:
      summary: Add images to a room type
      description: >
        URLs must be uploaded via POST /uploads first. If any new image has isPrimary=true,
        the previous primary flag is cleared so there is always at most one primary image.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: roomTypeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [url]
                    properties:
                      url: { type: string, format: uri }
                      isPrimary: { type: boolean }
                      sortOrder: { type: integer }
      responses:
        '201':
          description: Full image list of the room type
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoomTypeImage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/contacts:
