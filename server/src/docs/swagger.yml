  /hotels/{hotelId}/rooms:
    post:
      summary: Create a physical room
      description: >
        Room number must be unique within the hotel. Future room_availability rows of the
        room type get totalRooms incremented so already-priced nights sell the new room too.


        `status` only accepts `available` or `cleaning`. `maintenance` used to be accepted here and
        quietly created a 7-day OOO block with an invented reason — a partner filling in a room form
        pulled a room out of sale for a week without ever entering a date. Block the room through
        POST .../rooms/{roomId}/blocks instead. `occupied` must come from a check-in.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomTypeId, roomNumber]
              properties:
                roomTypeId: { type: string, format: uuid }
                roomNumber: { type: string }
                floor: { type: integer }
                status: { type: string, enum: [available, cleaning], default: available }
                notes: { type: string }
      responses:
        '201':
          description: Created room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '400': { description: Duplicate room number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      summary: List physical rooms (filter by status, room type)
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [available, occupied, maintenance, cleaning] }
        - in: query
          name: roomTypeId
          schema: { type: string, format: uuid }
        - in: query
          name: sortBy
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer }
      responses:
        '200':
          description: Paginated room list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedRooms' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/rooms/{roomId}:
    put:
      summary: Update a room (status, number, floor, notes)
      description: >
        Hotel owner or manageHotels. Toggling `isActive` syncs future sellable inventory
        (room_availability.totalRooms).


        `status` only accepts `available` or `cleaning` — it is forwarded to the housekeeping
        dimension. Maintenance has dates, so it belongs to POST .../rooms/{roomId}/blocks; this form
        used to accept `maintenance` and silently create a 7-day block instead.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: roomId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roomNumber: { type: string }
                floor: { type: integer }
                status: { type: string, enum: [available, cleaning] }
                notes: { type: string }
              example:
                status: cleaning
                notes: Hỏng điều hoà, chờ linh kiện
      responses:
        '200':
          description: Updated room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '400': { description: Duplicate room number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Someone else changed the room status first — retry }
    delete:
      summary: Delete a room (only if never booked)
      description: >
        Hotel owner or manageHotels. Allowed only when the room has no booking history; otherwise 400 —
        set status=maintenance instead. Future inventory (room_availability.totalRooms) is decremented,
        except for a room already in maintenance (it was removed from inventory back then).
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: roomId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '400':
          description: Room has booking history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/pricing-rules:
    post:
      summary: Create a pricing rule
      description: >
        roomTypeId null/omitted = rule applies to the whole hotel. Matching nights get the
        highest-priority rule applied on top of (priceOverride ?? basePrice). early_bird rules
        match when TODAY (booking time) is inside [startDate, endDate]; other types match the
        stay night. occupancy rules require occupancyThreshold (% booked) and fire when the
        night's occupancy reaches it. adjustmentValue can be negative (discount).
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, ruleType, startDate, endDate, adjustmentType, adjustmentValue]
              properties:
                roomTypeId: { type: string, format: uuid, nullable: true }
                name: { type: string }
                ruleType: { type: string, enum: [seasonal, weekend, occupancy, early_bird] }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                dayOfWeek:
                  type: array
                  items: { type: integer, minimum: 0, maximum: 6 }
                  description: 0=Sunday..6=Saturday; empty = every day
                occupancyThreshold: { type: integer, minimum: 1, maximum: 100 }
                adjustmentType: { type: string, enum: [percentage, fixed] }
                adjustmentValue: { type: number, description: negative = discount }
                priority: { type: integer, default: 0 }
                isActive: { type: boolean, default: true }
              example:
                name: Phụ thu cuối tuần
                ruleType: weekend
                startDate: '2026-06-01'
                endDate: '2026-08-31'
                dayOfWeek: [5, 6]
                adjustmentType: percentage
                adjustmentValue: 20
                priority: 10
      responses:
        '201':
          description: Created pricing rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      summary: List pricing rules of a hotel
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: roomTypeId
          schema: { type: string, format: uuid }
        - in: query
          name: isActive
          schema: { type: boolean }
      responses:
        '200':
          description: Rules ordered by priority desc
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PricingRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/pricing-rules/{ruleId}:
    put:
      summary: Update a pricing rule
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: ruleId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any subset of the create fields
      responses:
        '200':
          description: Updated pricing rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingRule' }
        '400': { description: endDate before startDate after merge }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete a pricing rule
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: ruleId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /amenities:
    get:
      summary: List all amenities
      description: Public. Optional category filter (room/hotel/service).
      tags: [Amenities]
      parameters:
        - in: query
          name: category
          schema: { type: string, enum: [room, hotel, service] }
      responses:
        '200':
          description: Amenity catalog list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Amenity' }
    post:
      summary: Create an amenity (partner or admin)
      description: >
        Requires the manageAmenities right (hotel_partner or admin). Name is globally unique and
        compared case-insensitively (trimmed) to keep the shared catalog free of near-duplicates.
      tags: [Amenities]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name: { type: string }
                icon: { type: string }
                category: { type: string, enum: [room, hotel, service] }
              example:
                name: Máy pha cà phê
                icon: coffee
                category: room
      responses:
        '201':
          description: Created amenity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Amenity' }
        '400': { description: Duplicate name }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hotel-partners/documents/{documentId}/replace:
    post:
      summary: Re-upload a rejected document (owner)
      description: The partner who owns the document submits a new file URL; a new pending document is created and the old one is marked replaced.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileUrl
              properties:
                fileUrl:
                  type: string
                  format: uri
      responses:
        '201':
          description: Replacement document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationDocument'
        '400':
          description: Document is not in a rejected state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ===== Mức hoa hồng nền tảng =====

  /hotels/{hotelId}/commission-rate:
    get:
      summary: Current commission rate applied to a hotel
      description: >
        Hotel owner (or manageHotels). Returns the rate in force today, whether it comes from a
        hotel-specific agreement or the platform base rate, how many days the agreement still has,
        the rate it falls back to when it expires, any pending request, and whether a new request
        may be filed right now (with the reason when it may not).
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current rate summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentRate: { type: string, example: '12.00' }
                  source: { type: string, enum: [platform_base, hotel_agreement] }
                  baseRate: { type: string, example: '15.00' }
                  agreement:
                    nullable: true
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      rate: { type: string }
                      effectiveFrom: { type: string, format: date }
                      effectiveTo: { type: string, format: date }
                      daysRemaining: { type: integer }
                      rateAfterExpiry:
                        type: string
                        description: Base rate on the day AFTER expiry, not the base rate today
                  pendingRequest:
                    nullable: true
                    allOf: [{ $ref: '#/components/schemas/CommissionRateRequest' }]
                  canRequest:
                    type: object
                    properties:
                      allowed: { type: boolean }
                      reason: { type: string, nullable: true }
                      isRenewal: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/commission-requests:
    post:
      summary: File a request to lower a hotel's commission rate
      description: >
        Hotel owner (or manageHotels). The proposed rate must be BELOW the rate that would otherwise
        apply and not under the 10% floor. One pending request per hotel; a rejected request locks
        new submissions for 7 days. While a discount is running only a renewal is allowed, and only
        within 30 days of its expiry — a renewal is compared against the base rate that takes over
        after expiry, not against the discount currently enjoyed.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestedRate, reason]
              properties:
                requestedRate: { type: number, example: 12 }
                reason: { type: string, minLength: 10, maxLength: 1000 }
      responses:
        '201':
          description: Request filed, awaiting Platform Manager review
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommissionRateRequest' }
        '400':
          description: Rate not below the applicable rate, under the floor, duplicate pending request, cooldown, or discount still running
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      summary: A hotel's commission request history
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Paginated requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: '#/components/schemas/CommissionRateRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /platform-manager/commission-requests:
    get:
      summary: Platform-wide queue of commission rate requests
      description: Platform Manager (manageCommissions). Oldest first so nothing is left waiting.
      tags: [PlatformManager]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
        - in: query
          name: hotelId
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Paginated requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Pagination'
                  - type: object
                    properties:
                      results:
                        type: array
                        items: { $ref: '#/components/schemas/CommissionRateRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform-manager/commission-requests/{requestId}/review:
    patch:
      summary: Approve or reject a commission rate request
      description: >
        Platform Manager (manageCommissions). Approving creates a 12-month agreement for that hotel.
        A renewal starts the day AFTER the current agreement expires so the partner never loses days
        already granted; a first-time request starts on the approval date. Never retroactive —
        commissions already recorded keep their snapshot rate. Rejecting requires a reason, and the
        partner must wait 7 days before filing again.
      tags: [PlatformManager]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                rejectionReason:
                  type: string
                  maxLength: 500
                  description: Required when rejecting, forbidden when approving
      responses:
        '200':
          description: Reviewed request (carries the created agreement when approved)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommissionRateRequest' }
        '400':
          description: Request already reviewed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /platform-manager/commission-rate:
    get:
      summary: Platform base commission rate — current, scheduled and history
      tags: [PlatformManager]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Base rate state
          content:
            application/json:
              schema:
                type: object
                properties:
                  currentRate: { type: string, example: '15.00' }
                  scheduled:
                    nullable: true
                    description: Rate already scheduled to take over on a future date
                    allOf: [{ $ref: '#/components/schemas/CommissionRate' }]
                  history:
                    type: array
                    items: { $ref: '#/components/schemas/CommissionRate' }
                  minRate: { type: number, example: 10 }
                  maxRate: { type: number, example: 30 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      summary: Set a new platform-wide base commission rate
      description: >
        Platform Manager (manageCommissions). Must sit between 10% and 30% and be announced at least
        30 days ahead — this changes terms for every partner, so every partner owner is notified.
        Hotel agreements still running are NOT touched; they fall to the new base only once they
        expire. Calling again before the scheduled date replaces the pending schedule.
      tags: [PlatformManager]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rate, effectiveFrom]
              properties:
                rate: { type: number, example: 18 }
                effectiveFrom: { type: string, format: date, example: '2026-10-01' }
      responses:
        '201':
          description: New base rate scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommissionRate' }
        '400':
          description: Rate outside 10-30% or notice period shorter than 30 days
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /platform-manager/partners/{partnerId}/status:
    patch:
      summary: Suspend or reactivate a partner
      description: >
        Platform Manager (manageHotels). This is the enforcement tool for serious breaches — it is
        NOT a way to interfere with an agreed commission rate; running agreements stay untouchable.
        Suspending unlists EVERY hotel of the partner (sales stop immediately) and blocks all of
        their management actions. Existing bookings are NOT cancelled — guests still get their stay
        and the partner still has to serve them through the operational endpoints. Reactivating
        returns the partner to approved but deliberately does NOT re-list the hotels; the partner
        publishes each one again after reviewing it.
      tags: [PlatformManager]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: partnerId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [suspend, reactivate] }
                reason:
                  type: string
                  maxLength: 500
                  description: Required when suspending, forbidden when reactivating
            example:
              action: suspend
              reason: Phát hiện booking ảo nhằm trục lợi ưu đãi hoa hồng
      responses:
        '200':
          description: Updated partner plus how many hotels were unlisted
          content:
            application/json:
              schema:
                type: object
                properties:
                  partner:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      businessName: { type: string }
                      status: { type: string, enum: [pending, approved, suspended, rejected] }
                      rejectionReason: { type: string, nullable: true, description: Carries the suspension reason too }
                  unlistedHotels: { type: integer, example: 3 }
        '400':
          description: Partner is not in a state that allows this action
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
