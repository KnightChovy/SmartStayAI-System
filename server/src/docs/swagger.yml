  /hotels/{hotelId}/rooms:
    post:
      summary: Create a physical room
      description: >
        Room number must be unique within the hotel. Future room_availability rows of the
        room type get totalRooms incremented so already-priced nights sell the new room too.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomTypeId, roomNumber]
              properties:
                roomTypeId: { type: string, format: uuid }
                roomNumber: { type: string }
                floor: { type: integer }
                status: { type: string, enum: [available, occupied, maintenance, cleaning], default: available }
                notes: { type: string }
      responses:
        '201':
          description: Created room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '400': { description: Duplicate room number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      summary: List physical rooms (filter by status, room type)
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [available, occupied, maintenance, cleaning] }
        - in: query
          name: roomTypeId
          schema: { type: string, format: uuid }
        - in: query
          name: sortBy
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer }
      responses:
        '200':
          description: Paginated room list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedRooms' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/rooms/{roomId}:
    put:
      summary: Update a room (status, number, floor, notes)
