        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/room-types/{roomTypeId}/amenities:
    put:
      summary: Set room type amenities (replace all, N-N)
      description: >
        The sent list REPLACES the current amenity set; an empty array clears all amenities.
        Each item may carry isFree (default true) and quantity.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: roomTypeId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amenities]
              properties:
                amenities:
                  type: array
                  items: { $ref: '#/components/schemas/AmenityAssignment' }
      responses:
        '200':
          description: Room type with the new amenity set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomType' }
        '400': { description: Some amenity ids do not exist }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/rooms:
    post:
      summary: Create a physical room
      description: >
        Room number must be unique within the hotel. Future room_availability rows of the
        room type get totalRooms incremented so already-priced nights sell the new room too.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roomTypeId, roomNumber]
              properties:
                roomTypeId: { type: string, format: uuid }
                roomNumber: { type: string }
                floor: { type: integer }
                status: { type: string, enum: [available, occupied, maintenance, cleaning], default: available }
                notes: { type: string }
      responses:
        '201':
          description: Created room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '400': { description: Duplicate room number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      summary: List physical rooms (filter by status, room type)
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [available, occupied, maintenance, cleaning] }
        - in: query
          name: roomTypeId
          schema: { type: string, format: uuid }
        - in: query
          name: sortBy
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer }
        - in: query
          name: page
          schema: { type: integer }
      responses:
        '200':
          description: Paginated room list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedRooms' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/rooms/{roomId}:
    put:
      summary: Update a room (status, number, floor, notes)
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: roomId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roomNumber: { type: string }
                floor: { type: integer }
                status: { type: string, enum: [available, occupied, maintenance, cleaning] }
                notes: { type: string }
              example:
                status: maintenance
                notes: Hỏng điều hoà, chờ linh kiện
      responses:
        '200':
          description: Updated room
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '400': { description: Duplicate room number }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete a room (only if never booked)
      description: >
        Hotel owner or manageHotels. Allowed only when the room has no booking history; otherwise 400 —
        set status=maintenance instead. Future inventory (room_availability.totalRooms) is decremented.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: roomId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '400':
          description: Room has booking history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/pricing-rules:
    post:
      summary: Create a pricing rule
      description: >
        roomTypeId null/omitted = rule applies to the whole hotel. Matching nights get the
        highest-priority rule applied on top of (priceOverride ?? basePrice). early_bird rules
        match when TODAY (booking time) is inside [startDate, endDate]; other types match the
        stay night. occupancy rules require occupancyThreshold (% booked) and fire when the
        night's occupancy reaches it. adjustmentValue can be negative (discount).
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, ruleType, startDate, endDate, adjustmentType, adjustmentValue]
              properties:
                roomTypeId: { type: string, format: uuid, nullable: true }
                name: { type: string }
                ruleType: { type: string, enum: [seasonal, weekend, occupancy, early_bird] }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
                dayOfWeek:
                  type: array
                  items: { type: integer, minimum: 0, maximum: 6 }
                  description: 0=Sunday..6=Saturday; empty = every day
                occupancyThreshold: { type: integer, minimum: 1, maximum: 100 }
                adjustmentType: { type: string, enum: [percentage, fixed] }
                adjustmentValue: { type: number, description: negative = discount }
                priority: { type: integer, default: 0 }
                isActive: { type: boolean, default: true }
              example:
                name: Phụ thu cuối tuần
                ruleType: weekend
                startDate: '2026-06-01'
                endDate: '2026-08-31'
                dayOfWeek: [5, 6]
                adjustmentType: percentage
                adjustmentValue: 20
                priority: 10
      responses:
        '201':
          description: Created pricing rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      summary: List pricing rules of a hotel
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: roomTypeId
          schema: { type: string, format: uuid }
        - in: query
          name: isActive
          schema: { type: boolean }
      responses:
        '200':
          description: Rules ordered by priority desc
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PricingRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/pricing-rules/{ruleId}:
    put:
      summary: Update a pricing rule
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: ruleId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Any subset of the create fields
      responses:
        '200':
          description: Updated pricing rule
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PricingRule' }
        '400': { description: endDate before startDate after merge }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete a pricing rule
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: ruleId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /amenities:
    get:
      summary: List all amenities
      description: Public. Optional category filter (room/hotel/service).
      tags: [Amenities]
      parameters:
        - in: query
          name: category
          schema: { type: string, enum: [room, hotel, service] }
      responses:
        '200':
          description: Amenity catalog list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Amenity' }
    post:
      summary: Create an amenity (partner or admin)
      description: >
        Requires the manageAmenities right (hotel_partner or admin). Name is globally unique and
        compared case-insensitively (trimmed) to keep the shared catalog free of near-duplicates.
      tags: [Amenities]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, category]
              properties:
                name: { type: string }
                icon: { type: string }
                category: { type: string, enum: [room, hotel, service] }
              example:
                name: Máy pha cà phê
                icon: coffee
                category: room
      responses:
        '201':
          description: Created amenity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Amenity' }
        '400': { description: Duplicate name }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /hotel-partners/documents/{documentId}/replace:
    post:
      summary: Re-upload a rejected document (owner)
      description: The partner who owns the document submits a new file URL; a new pending document is created and the old one is marked replaced.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fileUrl
              properties:
                fileUrl:
                  type: string
                  format: uri
      responses:
        '201':
          description: Replacement document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationDocument'
        '400':
          description: Document is not in a rejected state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
