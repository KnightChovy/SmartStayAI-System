                      transportType: { type: string, enum: [walk, car, public_transport, taxi, shuttle], nullable: true }
                      journeyMinutes: { type: integer, minimum: 0, nullable: true }
      responses:
        '200':
          description: Hotel nearby places after replace
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/HotelNearbyPlace' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/amenities:
