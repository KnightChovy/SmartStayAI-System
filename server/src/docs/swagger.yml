      description: Uploads a single image/PDF (multipart field "file") and returns its public URL.
      tags: [Uploads]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: folder
          schema:
            type: string
            enum: [licenses, representatives, properties, documents]
          description: Cloudinary sub-folder to group the file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: https://res.cloudinary.com/demo/image/upload/v1/smartstay/licenses/abc.jpg
                  publicId:
                    type: string
                    example: smartstay/licenses/abc
        '400':
          description: No file uploaded or invalid file type/size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /hotel-partners/me/bookings:
    get:
      summary: List all bookings across my hotels (partner)
      description: >
        Auth (partner). Lists bookings of ALL hotels owned by the logged-in partner (partner derived from
        token). Optionally narrow to one of their hotels via hotelId. Same shape as the platform oversight list.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, confirmed, checked_in, checked_out, cancelled, no_show] }
        - in: query
          name: hotelId
          schema: { type: string, format: uuid }
          description: Narrow to one of the partner's hotels
        - in: query
          name: fromDate
          schema: { type: string, format: date }
        - in: query
          name: toDate
          schema: { type: string, format: date }
        - in: query
          name: search
          schema: { type: string }
          description: Match bookingCode / customer fullName / customer email
        - in: query
          name: sortBy
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Paginated bookings across the partner's hotels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedOversightBookings' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /hotel-partners/registrations:
    post:
      summary: Submit a hotel partner registration
      description: >
        Reuses the user's active partner or creates one if none (a partner can own multiple hotels),
        then creates a Hotel (not yet active), its licenses, representative, images, payout account,
        room config and a pending verification request — all in one transaction.
        Any authenticated user can submit. File URLs must be uploaded via POST /uploads first.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelRegistrationRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationRequest'
        '400':
          description: Validation error or duplicate pending/approved partner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      summary: List verification requests (platform manager)
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_review, approved, rejected]
        - in: query
          name: sortBy
          schema:
            type: string
          description: 'field:(desc|asc) e.g. submittedAt:desc'
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/HotelVerificationRequestSummary'
                  page: { type: integer, example: 1 }
                  limit: { type: integer, example: 10 }
                  totalPages: { type: integer, example: 1 }
                  totalResults: { type: integer, example: 1 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /hotel-partners/registrations/me:
    get:
      summary: List my own verification requests
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HotelVerificationRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /hotel-partners/registrations/{requestId}:
    get:
      summary: Get a verification request by id
      description: Accessible by the owner or a platform manager.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotel-partners/registrations/{requestId}/review:
    patch:
      summary: Approve or reject a verification request (platform manager)
      description: >
        On approve - partner becomes approved, the owner user's role is upgraded to hotel_partner,
        the hotel is activated but NOT yet published (isListed=false), RoomType + Room records are
        seeded from the declared roomConfig (rooms inactive until the partner completes details and
        publishes in Room Inventory), and the partner receives a 'partner_approved' notification.
        On reject - a rejectionReason is required. In both cases an email with the result (approved /
        rejected) is sent to the partner's registration email after the change is committed.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: requestId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                rejectionReason:
                  type: string
                  description: Required when decision is "reject"
      responses:
        '200':
          description: Reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationRequest'
        '400':
          description: Already reviewed or invalid payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotel-partners/documents/{documentId}/review:
    patch:
      summary: Approve or reject a single document (platform manager)
      description: >
        Fine-grained review (Hướng B). On approve, if the document type is also a license type,
        the matching license's current_document_id is set to this document.
      tags: [HotelPartners]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
      responses:
        '200':
          description: Reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelVerificationDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotels:
    get:
      summary: Search hotels by city (with availability check)
      description: >
        Public. Returns active & listed hotels. When checkIn/checkOut are provided (they must go
        together), only hotels with at least one room type available for every night of the stay
        are returned. Each result includes minPrice (lowest base price among matching room types).
      tags: [Hotels]
      parameters:
        - in: query
          name: city
          schema:
            type: string
          description: Case-insensitive partial match
        - in: query
          name: checkIn
          schema:
            type: string
            format: date
        - in: query
          name: checkOut
          schema:
            type: string
            format: date
          description: Must be after checkIn
        - in: query
          name: guests
          schema:
            type: integer
            minimum: 1
          description: Only hotels having a room type with maxOccupancy >= guests
        - in: query
          name: sortBy
          schema:
            type: string
          description: 'field:(desc|asc) e.g. starRating:desc'
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: Paginated hotel list ({ results, page, limit, totalPages, totalResults })
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedHotels' }
        '400':
          description: Invalid query (e.g. checkIn without checkOut)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /hotels/{hotelId}:
    get:
      summary: Get a hotel's full profile by id
      description: >
        Public. Returns one active & listed hotel with all images, hotel amenities and its active
        room types (each with images, amenities and base price). Date-based availability/pricing is
        fetched separately via GET /hotels/{hotelId}/room-types?checkIn=&checkOut=.
      tags: [Hotels]
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Hotel profile (info + images + amenities + active room types)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hotel' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      summary: Update a hotel's profile (partner)
      description: >
        Auth. The owner (or manageHotels) updates editable profile fields (name, description, address,
        city/district/ward, country, coordinates, star rating, check-in/out times, business type).
        Locked here: isActive/isListed (dedicated flows) and legal fields (taxCode,
        businessRegistrationNumber). All fields optional; at least one required.


        settings.cancellation sets the terms that actually decide refunds. Unknown keys are
        rejected with 400 on purpose — a typo like "freeUntilHour" must not silently fall back to
        the 48h default. Sending settings merges into the stored JSON, it does not replace it.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                settings:
                  type: object
                  description: 'Hotel settings. Only `cancellation` is accepted today; both of its keys are required together'
                  required: [cancellation]
                  additionalProperties: false
                  properties:
                    cancellation:
                      type: object
                      required: [freeUntilHours, latePenalty]
                      additionalProperties: false
                      properties:
                        freeUntilHours: { type: integer, minimum: 0, maximum: 2160, example: 24, description: 'Hours before check-in that still get a full refund. 0 = never free; max 2160 (90 days)' }
                        latePenalty: { type: string, enum: [first_night, full] }
                name: { type: string }
                description: { type: string, nullable: true }
                address: { type: string }
                city: { type: string }
                country: { type: string }
                district: { type: string, nullable: true }
                ward: { type: string, nullable: true }
                latitude: { type: number, nullable: true }
                longitude: { type: number, nullable: true }
                starRating: { type: integer, minimum: 1, maximum: 5, nullable: true }
                checkInTime: { type: string, example: '14:00' }
                checkOutTime: { type: string, example: '12:00' }
                businessType: { type: string, enum: [hotel, resort, villa, apartment] }
                # ----- Chi tiết bổ sung kiểu booking.com (Pha 1 DB) -----
                postalCode: { type: string, nullable: true }
                phone: { type: string, nullable: true }
                email: { type: string, format: email, nullable: true }
                totalFloors: { type: integer, minimum: 0, maximum: 200, nullable: true }
                builtYear: { type: integer, minimum: 1800, maximum: 2100, nullable: true }
                renovationYear: { type: integer, minimum: 1800, maximum: 2100, nullable: true }
                isSmokingAllowed: { type: boolean }
                petsPolicy: { type: string, enum: [not_allowed, allowed, on_request], nullable: true }
                cancellationPolicy: { type: string, nullable: true }
                childrenPolicy: { type: string, nullable: true }
                minGuestAge: { type: integer, minimum: 0, maximum: 120, nullable: true }
                securityDepositAmount: { type: number, minimum: 0, nullable: true }
                languagesSpoken: { type: array, items: { type: string }, description: 'send [] to clear' }
                maxLengthOfStay: { type: integer, minimum: 1, maximum: 365, nullable: true }
      responses:
        '200':
          description: Updated hotel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hotel' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/manage:
    get:
      summary: Get a hotel's full profile for management (owner/manager)
      description: >
        Auth. Returns the hotel REGARDLESS of status (including unlisted/pending) for the owner
        (or a user with the manageHotels right) — used by the partner's Hotel Management screen.
        Includes all images, amenities and ALL room types (active + inactive), each with its room count.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Full hotel profile (any status) for management
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hotel' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/revenue:
    get:
      summary: Hotel revenue report (owner/manager)
      description: >
        Auth. Revenue for ONE hotel over [from, to]. gross = total of settled bookings
        (confirmed/checked_in/checked_out); commission = platform commission; net = gross − commission;
        refunded = total refunded. Includes a day/month time series. All money values are strings.
        Access is limited to the hotel owner, a manager, or assigned staff (checked in-service).
      tags: [Revenue]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: from
          schema: { type: string, format: date }
          description: Inclusive start date (YYYY-MM-DD). Omit for all-time.
        - in: query
          name: to
          schema: { type: string, format: date }
          description: Inclusive end date (YYYY-MM-DD). Omit for all-time.
        - in: query
          name: groupBy
          schema: { type: string, enum: [day, month], default: day }
      responses:
        '200':
          description: Revenue summary + time series
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    properties:
                      gross: { type: string, example: '12500000' }
                      commission: { type: string, example: '1875000' }
                      net: { type: string, example: '10625000' }
                      refunded: { type: string, example: '500000' }
                      bookingCount: { type: integer, example: 25 }
                  groupBy: { type: string, example: day }
                  series:
                    type: array
                    items:
                      type: object
                      properties:
                        period: { type: string, example: '2026-07-01' }
                        gross: { type: string }
                        commission: { type: string }
                        net: { type: string }
                        bookingCount: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/wallet:
    get:
      summary: Hotel wallet balance + transactions (owner/manager)
      description: >
        Auth. Wallet balances (available/pending) and the paginated transaction ledger for ONE hotel.
        A hotel with no transactions yet returns a zero-balance wallet instead of 404.
        Money values are strings. Access checked in-service (owner/manager/assigned staff).
      tags: [Revenue]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: type
          schema: { type: string, enum: [earning, commission, payout, refund, adjustment] }
          description: Filter transactions by type.
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Wallet balances + paginated transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  wallet:
                    type: object
                    properties:
                      balanceAvailable: { type: string, example: '10625000' }
                      balancePending: { type: string, example: '0' }
                      currency: { type: string, example: VND }
                  transactions:
                    type: object
                    properties:
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            type: { type: string, example: earning }
                            amount: { type: string, example: '850000' }
                            balanceAfter: { type: string, example: '850000' }
                            bookingId: { type: string, format: uuid, nullable: true }
                            commissionId: { type: string, format: uuid, nullable: true }
                            description: { type: string, nullable: true }
                            createdAt: { type: string, format: date-time }
                      page: { type: integer }
                      limit: { type: integer }
                      totalPages: { type: integer }
                      totalResults: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/analytics:
    get:
      summary: Hotel operational analytics + score (owner/manager)
      description: >
        Auth. Operational performance for ONE hotel over a window (default last 90 days): occupancyRate,
        cancellationRate, avgRating, avgResponseMinutes, plus each metric normalized to 0..100 and a
        weighted overall score (rating 40% / occupancy 25% / cancellation 20% / response 15%). Reuses the
        platform performance logic but scoped to the hotel owner/manager (checked in-service). This is the
        partner-facing view of the same metrics platform managers see at /platform-manager.
      tags: [Revenue]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: from
          schema: { type: string, format: date }
          description: Window start (YYYY-MM-DD). Defaults to 90 days before "to".
        - in: query
          name: to
          schema: { type: string, format: date }
          description: Window end (YYYY-MM-DD). Defaults to today.
      responses:
        '200':
          description: Hotel performance metrics + scores
          content:
            application/json:
              schema:
                type: object
                properties:
                  hotelId: { type: string, format: uuid }
                  hotelName: { type: string }
                  city: { type: string }
                  window:
                    type: object
                    properties:
                      from: { type: string, format: date-time }
                      to: { type: string, format: date-time }
                  metrics:
                    type: object
                    properties:
                      occupancyRate: { type: number, nullable: true, example: 0.72 }
                      cancellationRate: { type: number, nullable: true, example: 0.08 }
                      avgRating: { type: number, nullable: true, example: 4.3 }
                      avgResponseMinutes: { type: number, nullable: true, example: 45 }
                      totalBookings: { type: integer }
                      cancelledBookings: { type: integer }
                      reviewCount: { type: integer }
                  scores:
                    type: object
                    properties:
                      rating: { type: integer, nullable: true }
                      occupancy: { type: integer, nullable: true }
                      cancellation: { type: integer, nullable: true }
                      response: { type: integer, nullable: true }
                  score: { type: integer, nullable: true, example: 82 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/publish:
    patch:
      summary: Toggle a hotel's listing on/off (partner self-publish)
      description: >
        Auth. The owner (or a user with manageHotels) turns the hotel's marketplace listing on or off
        via { isListed }. Turning ON requires the hotel to be approved (isActive) and to have at least
        one active room type (priced) — otherwise 400. Turning OFF is unconditional.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isListed]
              properties:
                isListed: { type: boolean }
      responses:
        '200':
          description: Updated hotel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Hotel' }
        '400':
          description: Not approved yet, or no active room type when turning on
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/mine:
    get:
      summary: List hotels owned by the current partner
      description: >
        Auth. Returns every hotel owned by the LOGGED-IN user (partner) — including unlisted/pending
        ones (soft-deleted excluded) — for the partner's Hotel Management screen. The owner id is taken
        from the token, NOT the URL. Each item includes the cover image and a count of room types and rooms.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of hotels (each with primary image + _count of roomTypes/rooms)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HotelSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /hotels/staff/mine:
    get:
      summary: List hotels the current staff is assigned to
      description: >
        Auth (staff). Returns hotels the LOGGED-IN staff is currently assigned to (via
        hotel_staff_assignments, unassignedAt = null). The staff portal uses this to know which hotel(s)
        to operate on (bookings / room status / check-in-out). Staff id is taken from the token.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of assigned hotels (each with primary image + _count of roomTypes/rooms)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HotelSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /hotels/{hotelId}/images:
    post:
      summary: Add hotel images (partner)
      description: URLs must be uploaded via POST /uploads first. If any image has isPrimary=true, the previous primary is cleared.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [url, imageCategory]
                    properties:
                      url: { type: string, format: uri }
                      imageCategory: { type: string, enum: [cover, exterior, room] }
                      caption: { type: string }
                      isPrimary: { type: boolean }
                      sortOrder: { type: integer }
      responses:
        '201':
          description: Hotel images after insert
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HotelImage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/images/{imageId}:
    delete:
      summary: Delete a hotel image (partner)
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: imageId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/images/{imageId}/primary:
    patch:
      summary: Set a hotel image as primary (partner)
      description: Marks this image isPrimary=true and clears the flag on the hotel's other images.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: imageId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The updated primary image
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HotelImage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/room-types:
    get:
      summary: Search room types within a hotel (with filters)
      description: >
        Public. Filters by capacity, price range, bed type and view type. When checkIn/checkOut
        are provided, sold-out room types are excluded and each room type carries the full price
        breakdown for the stay: numNights, availableRooms, subtotal (room charge with pricing
        rules and per-night priceOverride applied), taxAmount, feeAmount and totalPrice.
        totalPrice = subtotal + taxAmount + feeAmount and equals booking.totalAmount, so the
        figure shown here is exactly what the guest is charged. Note: totalPrice used to exclude
        tax and fees.
      tags: [Hotels]
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: checkIn
          schema:
            type: string
            format: date
        - in: query
          name: checkOut
          schema:
            type: string
            format: date
        - in: query
          name: guests
          schema:
            type: integer
            minimum: 1
        - in: query
          name: minPrice
          schema:
            type: number
        - in: query
          name: maxPrice
          schema:
            type: number
        - in: query
          name: bedType
          schema:
            type: string
        - in: query
          name: viewType
          schema:
            type: string
      responses:
        '200':
          description: Room types with images & amenities (plus availability and total price when dates given)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RoomType' }
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications:
    get:
      summary: List the current user's notifications
      description: >
        Paginated list of the authenticated user's own notifications (newest first). Filter by
        `type` or `unreadOnly=true`. The response also includes `unreadCount` (total unread across
        all types) so the client can render a badge without a second request.
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: unreadOnly
          schema:
            type: boolean
          description: When true, only notifications that have not been read yet
        - in: query
          name: type
          schema:
            type: string
            enum: [booking_confirmed, payment_success, check_in_reminder, review_request, alert, promotion, partner_approved]
        - in: query
          name: sortBy
          schema:
            type: string
          description: 'field:asc|desc, e.g. createdAt:desc'
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: Paginated notifications of the current user (with unreadCount)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedNotifications' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/unread-count:
    get:
      summary: Get the current user's unread notification count
      tags: [Notifications]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread count for the badge
          content:
            application/json:
              schema:
                type: object
                properties:
                  unreadCount: { type: integer, example: 3 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/read-all:
    post:
      summary: Mark all the current user's notifications as read
      tags: [Notifications]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Number of notifications updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer, example: 5 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /notifications/{notificationId}/read:
    patch:
      summary: Mark one notification as read
      description: >
        Marks a single notification (owned by the authenticated user) as read. Idempotent —
        an already-read notification keeps its original readAt timestamp.
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The updated notification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/{notificationId}:
    delete:
      summary: Delete one of the current user's notifications
      tags: [Notifications]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: notificationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings:
    post:
      summary: Create a booking
      description: >
        Authenticated customers book one room of a room type for [checkInDate, checkOutDate).
        Prices are computed server-side (pricing rules and per-night priceOverride applied, plus
        tax/fee from the hotel policies) and match what GET /hotels/{hotelId}/room-types quoted.
        Inventory is reserved per night inside a transaction, so concurrent bookings cannot
        oversell. paymentMethod "vnpay" (default) creates a "pending" booking held 15 min for online
        payment; "cash" (pay at hotel) creates a "confirmed" booking with no hold plus a pending cash
        Payment and an e-voucher — staff records the cash later via record-cash-payment.


        REQUIRES A PHONE NUMBER: the hotel must be able to reach the guest, so the account's
        profile must have a phone. There is no phone field in this request — the number is taken
        from the user profile (User.phone). If it is empty the request fails with 400 and the
        client should send the user to update their profile first (PATCH /users/me).
      tags: [Bookings]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - hotelId
                - roomTypeId
                - checkInDate
                - checkOutDate
                - numGuests
              properties:
                hotelId:
                  type: string
                  format: uuid
                roomTypeId:
                  type: string
                  format: uuid
                checkInDate:
                  type: string
                  format: date
                checkOutDate:
                  type: string
                  format: date
                  description: Must be after checkInDate (max 30 nights)
                numGuests:
                  type: integer
                  minimum: 1
                specialRequests:
                  type: string
                paymentMethod:
                  type: string
                  enum: [vnpay, sepay, cash]
                  default: vnpay
                  description: >
                    vnpay = pay online via gateway (15 min hold); sepay = bank transfer by scanning a
                    VietQR (30 min hold, confirmed by webhook); cash = pay at the hotel on arrival
                    (confirmed immediately)
              example:
                hotelId: 11111111-1111-1111-1111-111111111111
                roomTypeId: 22222222-2222-2222-2222-222222222222
                checkInDate: '2026-07-01'
                checkOutDate: '2026-07-03'
                numGuests: 2
                paymentMethod: cash
      responses:
        '201':
          description: Booking created (includes bookingCode, totals, hotel & roomType summary)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400':
          description: Sold out for a night, past check-in date, or capacity exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings/me:
    get:
      summary: List my bookings
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, checked_in, checked_out, cancelled, no_show]
        - in: query
          name: sortBy
          schema:
            type: string
          description: 'field:(desc|asc) e.g. createdAt:desc'
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: Paginated booking list ({ results, page, limit, totalPages, totalResults })
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedBookings' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /bookings/{bookingId}:
    get:
      summary: Get a booking by id
      description: Accessible by the booking owner or a user with the manageBookings right.
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking detail (with hotel & roomType summary)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /bookings/{bookingId}/cancel:
    patch:
      summary: Cancel a booking
      description: >
        Owner (or manageBookings) cancels a pending/confirmed booking before its check-in date.
        Reserved inventory is released immediately for every night of the stay.


        If the booking was paid, the refund amount is computed from the hotel's cancellation policy
        (default: full refund if cancelled ≥48h before check-in, otherwise the first night is kept as
        a penalty) and a **refund REQUEST is created with status `pending`** — the money is NOT sent
        yet. The hotel reviews it (PATCH /hotels/{hotelId}/refunds/{refundId}/review). The Payment
        status, platform commission and hotel wallet are only touched once the refund is actually
        settled, so a rejected request never wrongly debits the hotel.


        WHERE THE MONEY GOES — the guest picks with `refundMethod`:

        * `wallet` (default) — credited to the guest's wallet. The money never leaves the platform,
          so as soon as the hotel approves it is credited automatically and the refund jumps
          straight to `processed`. Nobody has to transfer anything. Spend it later via
          POST /payments/bookings/{bookingId}/wallet.

        * `bank` — paid out to a bank account, which means `bankAccount` is REQUIRED (400 without
          it: otherwise nobody would know where to send the money). After the hotel approves, the
          Platform Manager transfers it and marks it processed
          (PATCH /platform-manager/refunds/{refundId}/process). The account number is stored
          encrypted and never returned.


        The response includes a `refund` summary (`id`, `amount`, `status`, `refundMethod`) when a
        refund is due, or `null` when the policy leaves nothing to refund (late cancellation penalty).
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                refundMethod:
                  type: string
                  enum: [wallet, bank]
                  default: wallet
                bankAccount:
                  type: object
                  description: 'Required when refundMethod is bank, and rejected otherwise'
                  required: [accountNumber, bankName, accountHolder]
                  properties:
                    accountNumber: { type: string, maxLength: 30, pattern: '^\d+$' }
                    bankName: { type: string, maxLength: 100, example: Vietcombank }
                    accountHolder: { type: string, maxLength: 100, example: NGUYEN VAN AN }
      responses:
        '200':
          description: Booking cancelled (with optional refund summary)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        '400':
          description: Not cancellable (wrong status or check-in date reached)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/bookings/{bookingId}/vnpay:
    post:
      summary: Create a VNPay payment URL for a booking
      description: >
        Owner of a pending (not yet expired) booking requests a VNPay payment URL.
        Creates a pending Payment row and returns the gateway URL the frontend should redirect to.
        Requires VNP_TMN_CODE / VNP_HASH_SECRET to be configured (503 otherwise).
      tags: [Payments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Payment URL created
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentUrl:
                    type: string
                    example: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html?vnp_Amount=...
        '400':
          description: Booking not payable (wrong status or hold expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: VNPay not configured

  /hotels/{hotelId}/refunds:
    get:
      summary: List refund requests for a hotel (owner/manager/assigned staff)
      description: >
        Refund requests raised when a guest cancels a paid booking. The hotel side reviews them
        (approve/reject); the Platform Manager is the one who actually transfers the money afterwards.
        Filter by `status` to get the review queue (`pending`).
      tags: [Refunds]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, processed, rejected] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Paginated refund requests (with requester, payment and booking summary)
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/Refund' }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
                  totalResults: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /hotels/{hotelId}/refunds/{refundId}/review:
    patch:
      summary: Approve or reject a refund request (hotel side)
      description: >
        Only a `pending` request can be reviewed. Approving does NOT move money — it just authorises
        the Platform Manager to transfer it (see PATCH /platform-manager/refunds/{refundId}/process).
        Rejecting requires a reason. Uses a conditional update so two reviewers racing cannot both win.


        ⏰ **3-day deadline**: a nightly job auto-approves any request still `pending` after 3 days, so a
        hotel cannot block a refund by staying silent (the amount comes from the hotel's own cancellation
        policy — this step is for exceptions, not a veto). Reviewing an auto-approved request returns 400.
      tags: [Refunds]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: refundId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                rejectionReason:
                  type: string
                  maxLength: 500
                  description: Required when decision = reject; forbidden otherwise
              example:
                decision: reject
                rejectionReason: Khách huỷ sát giờ, đã giữ phòng nên không hoàn
      responses:
        '200':
          description: Reviewed refund request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '400':
          description: Already reviewed, or reject without a reason
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /platform-manager/refunds:
    get:
      summary: List refund requests platform-wide (Platform Manager)
      description: Requires `manageCommissions`. Filter by status/hotel — use `status=approved` to get the payout queue.
      tags: [Refunds]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, processed, rejected] }
        - in: query
          name: hotelId
          schema: { type: string, format: uuid }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        '200':
          description: Paginated refund requests
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/Refund' }
                  page: { type: integer }
                  limit: { type: integer }
                  totalPages: { type: integer }
                  totalResults: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /platform-manager/refunds/{refundId}/process:
    patch:
      summary: Mark an approved refund as transferred (Platform Manager)
      description: >
        Requires `manageCommissions`. Call this AFTER the money has actually been transferred back to
        the guest, passing the real bank/gateway transaction id.


        Why the Platform Manager and not the hotel: guest money lands in the PLATFORM's bank account
        (escrow) — the hotel wallet is only a ledger balance, so the hotel has no money to send back.
        The hotel decides WHETHER to refund (review); the Platform Manager EXECUTES the transfer.


        This is the ONLY place money actually leaves the hotel. In one transaction it sets the refund
        to `processed`, marks the Payment `refunded` when the refund covers it fully, recomputes the
        platform commission on the amount the hotel ACTUALLY KEEPS, and debits the hotel wallet by the
        net difference. Only `approved` requests can be processed — a `pending` one must be reviewed
        by the hotel first.
      tags: [Refunds]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: refundId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refundTransactionId]
              properties:
                refundTransactionId:
                  type: string
                  maxLength: 100
                  description: Real transfer/gateway transaction id — kept for reconciliation
              example:
                refundTransactionId: FT26071612345678
      responses:
        '200':
          description: Refund processed (commission + wallet adjusted)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Refund' }
        '400':
          description: Not approved yet, or already processed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/bookings/{bookingId}/sepay:
    post:
      summary: Create a SePay bank-transfer QR for a booking
      description: >
        Owner of a pending (not yet expired) booking requests a SePay VietQR.
        Unlike VNPay there is no gateway to redirect to — the guest scans the returned QR image with
        their banking app and transfers the exact amount, keeping `transferContent` (the booking code)
        untouched so the webhook can reconcile it. The booking is only confirmed once SePay calls
        POST /payments/sepay/webhook. Calling this repeatedly returns the SAME transfer content
        (one SePay payment per booking). Requires SEPAY_API_KEY / SEPAY_ACCOUNT_NUMBER /
        SEPAY_BANK_CODE to be configured (503 otherwise).
      tags: [Payments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: QR + transfer instructions created
          content:
            application/json:
              schema:
                type: object
                properties:
                  qrUrl:
                    type: string
                    description: VietQR image URL — render directly with an img tag
                    example: https://qr.sepay.vn/img?acc=0010000000355&bank=Vietcombank&amount=1800000&des=BKMRJ0NXGQ341D22
                  transferContent:
                    type: string
                    description: Guest MUST keep this as the transfer content (it is the booking code)
                    example: BKMRJ0NXGQ341D22
                  amount:
                    type: number
                    example: 1800000
                  accountNumber:
                    type: string
                  bankCode:
                    type: string
                    example: Vietcombank
                  expiresAt:
                    type: string
                    format: date-time
                    nullable: true
                    description: Booking hold deadline — transfers after this are not auto-confirmed
        '400':
          description: Booking not payable (wrong status or hold expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: SePay not configured

  /payments/sepay/webhook:
    post:
      summary: SePay webhook — bank account credited (public, called by SePay)
      description: >
        Called SERVER-TO-SERVER by SePay whenever the linked bank account balance changes.
        Authenticated with the header `Authorization: Apikey <SEPAY_API_KEY>` — NOT a user JWT.
        Only `transferType: "in"` is processed; the booking code is extracted from `code`/`content`,
        the amount is verified, then the booking is confirmed (commission + wallet + voucher + email),
        reusing the same transaction as the VNPay flow. The key is read from SEPAY_WEBHOOK_API_KEY.


        Idempotent: SePay retries up to 7 times over 5 hours, so an already-completed payment simply
        returns success without reprocessing. Business mismatches (booking code not found, underpaid)
        also return 200 `{ success: true }` — retrying would not help — but are logged as errors for
        manual reconciliation. Genuine server errors return 5xx so SePay retries.
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, transferType, transferAmount]
              properties:
                id:
                  type: number
                  description: SePay transaction id
                gateway:
                  type: string
                  example: Vietcombank
                transactionDate:
                  type: string
                accountNumber:
                  type: string
                code:
                  type: string
                  nullable: true
                  description: Payment code SePay extracted (if a pattern is configured)
                content:
                  type: string
                  description: Raw transfer content — the booking code is parsed out of this
                  example: 'CT DEN:0011 BKMRJ0NXGQ341D22'
                transferType:
                  type: string
                  enum: [in, out]
                transferAmount:
                  type: number
                referenceCode:
                  type: string
      responses:
        '200':
          description: Webhook accepted (SePay requires success=true, otherwise it retries)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Thanh toán thành công
        '401':
          description: Missing or wrong API key
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: false }
                  message: { type: string, example: Invalid API key }

  /payments/vnpay/return:
    get:
      summary: VNPay browser return URL (public)
      description: >
        VNPay redirects the user's browser here after payment. The signature (vnp_SecureHash)
        is verified server-side; on success the booking is confirmed, commission recorded and an
        e-voucher issued. The endpoint then 302-redirects to the client payment-result page.
      tags: [Payments]
      parameters:
        - in: query
          name: vnp_TxnRef
          schema:
            type: string
        - in: query
          name: vnp_ResponseCode
          schema:
            type: string
        - in: query
          name: vnp_SecureHash
          schema:
            type: string
      responses:
        '302':
          description: Redirect to client payment-result page

  /payments/vnpay/ipn:
    get:
      summary: VNPay IPN endpoint (server-to-server, public)
      description: >
        VNPay calls this server-to-server to confirm the transaction outcome. Same verification and
        confirmation logic as the return URL, but responds with the VNPay JSON contract
        ({ RspCode, Message }). Idempotent on repeated calls.
      tags: [Payments]
      responses:
        '200':
          description: VNPay acknowledgement
          content:
            application/json:
              schema:
                type: object
                properties:
                  RspCode:
                    type: string
                    example: '00'
                  Message:
                    type: string
                    example: Thanh toán thành công

  /reviews:
    post:
      summary: Submit a review after checkout
      description: >
        A guest who completed a stay submits a review for their booking. Only the booking owner can
        review, the booking must be checked_out, and each booking can be reviewed once. hotelId is taken
        from the booking (not the client). Ratings are 1–5. Image URLs (uploaded via POST /uploads) are
        optional. The review is published immediately (the guest's stay is a verified purchase).
      tags: [Reviews]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReviewRequest'
      responses:
        '201':
          description: Review created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '400':
          description: Not checked out yet, or already reviewed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      summary: List a hotel's public reviews
      description: Public, paginated list of a hotel's published reviews (newest first).
      tags: [Reviews]
      parameters:
        - in: query
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: Paginated reviews
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedReviews' }

  /reviews/me:
    get:
      summary: List the current user's own reviews
      description: >
        Paginated list of reviews written by the authenticated user (newest first), across ALL hotels
        and ALL statuses (including pending/hidden — these are the user's own). Each item includes the
        hotel name, booking code, images, manager response and status. Replaces the client-side workaround
        of fetching each hotel's public reviews and filtering by customerId.
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sortBy
          schema:
            type: string
          description: 'field:asc|desc, e.g. createdAt:desc'
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: Paginated reviews of the current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedReviews' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /reviews/{reviewId}:
    get:
      summary: Get one public review
      tags: [Reviews]
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Update my own review
      description: >
        The review's author edits their own review. Only the owner can update it. Ratings, title,
        content and images are editable (all fields optional, at least one required); bookingId,
        hotelId and status cannot be changed. Sending `images` (even an empty array) replaces the
        whole image set with the new list.
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewRequest'
      responses:
        '200':
          description: Updated review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Review'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete my own review
      description: >
        The review's author deletes their own review. Only the owner can delete it. Attached images
        are removed automatically (cascade).
      tags: [Reviews]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Review deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/bookings:
    get:
      summary: List a hotel's bookings (staff/owner)
      description: >
        Owner, platform manager, or assigned staff lists bookings of the hotel, filtered by status
        and check-in date range. Each item includes customer, assigned rooms and voucher info.
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, checked_in, checked_out, cancelled, no_show]
        - in: query
          name: fromDate
          schema:
            type: string
            format: date
        - in: query
          name: toDate
          schema:
            type: string
            format: date
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: page
          schema:
            type: integer
      responses:
        '200':
          description: Paginated bookings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedStaffBookings' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/bookings/lookup:
    get:
      summary: Look up a booking by voucher code (staff QR scan)
      description: >
        Staff scans the guest QR / enters the e-voucher code to fetch the matching booking before
        check-in. Looks up by voucher_code and confirms the booking belongs to this hotel. Returns the
        booking with customer, assigned rooms and voucher info (same shape as the staff booking view).
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: voucherCode
          required: true
          schema:
            type: string
          description: The e-voucher code from the booking QR
      responses:
        '200':
          description: The matching booking
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffBooking' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/bookings/{bookingId}/check-in:
    post:
      summary: Check in a confirmed booking (staff)
      description: >
        Moves a confirmed (paid) booking to checked_in, assigns one available physical room of the
        booking's room type (or the room given by roomId), marks the e-voucher used. Optionally
        verifies the scanned voucherCode. Only allowed within the stay window
        (checkInDate <= today < checkOutDate) — too early or past the stay is rejected.
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                roomId:
                  type: string
                  format: uuid
                  description: Optional specific physical room to assign
                voucherCode:
                  type: string
                  description: Optional e-voucher code to verify at the desk
      responses:
        '200':
          description: Booking checked in (with assigned room)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffBooking' }
        '400':
          description: Not confirmed, voucher mismatch, or no free room
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/bookings/{bookingId}/check-out:
    post:
      summary: Check out a staying booking and issue an invoice (staff)
      description: >
        Moves a checked_in booking to checked_out, frees the assigned room(s) to cleaning status,
        and issues an Invoice (room subtotal + optional extra charge).
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                extraCharge:
                  type: number
                  minimum: 0
                  description: Extra charges incurred during the stay (added to the invoice total)
      responses:
        '200':
          description: Booking checked out (response includes the issued invoice)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffBooking' }
        '400':
          description: Booking is not currently checked in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/bookings/{bookingId}/no-show:
    post:
      summary: Mark a booking as no-show (staff)
      description: >
        Staff marks a confirmed booking whose check-in date has passed as no_show (guest never
        arrived). Prepaid (VNPay) bookings are forfeited — no refund, commission kept. A still-pending
        cash payment is marked failed. Inventory is not released.
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking marked no_show
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffBooking' }
        '400':
          description: Not confirmed, or check-in date not reached yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/bookings/{bookingId}/record-cash-payment:
    post:
      summary: Record cash received for a pay-at-hotel booking (staff)
      description: >
        Staff marks the pending cash Payment of a "pay at hotel" booking as completed (money collected
        at the desk) and records the platform commission at that point. Idempotent — a second call on
        an already-collected booking is rejected.
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Cash payment recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffBooking' }
        '400':
          description: No pending cash payment, or booking cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/bookings/{bookingId}:
    get:
      summary: Get one booking of a hotel (staff)
      description: >
        Owner, manager, or assigned staff fetches a single booking's detail (customer, assigned rooms,
        voucher, payments, and the invoice if already issued).
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: bookingId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffBooking' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/rooms/{roomId}/status:
    patch:
      summary: Update a room's status (staff room map / housekeeping)
      description: >
        Assigned staff (or owner/manager) quickly changes a room's operational status
        (available / occupied / maintenance / cleaning) — used by the room map and housekeeping.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: roomId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [available, occupied, maintenance, cleaning]
      responses:
        '200':
          description: Room status updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '400':
          description: Invalid status
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/housekeeping:
    get:
      summary: List housekeeping tasks (staff)
      description: >
        Assigned staff lists the hotel's housekeeping (room cleaning) tasks, optionally filtered by
        status. Tasks are auto-created when a booking checks out.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, in_progress, done]
      responses:
        '200':
          description: Housekeeping tasks (each with its room)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HousekeepingTask' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/housekeeping/{taskId}/complete:
    post:
      summary: Complete a housekeeping task (staff, 1-tap)
      description: >
        Marks a cleaning task done and returns the room to "available" (only if it is still in
        "cleaning"). Rejected if the task is already done.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: taskId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task completed, room freed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HousekeepingTask' }
        '400':
          description: Task already done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/conversations:
    get:
      summary: List a hotel's chat conversations (staff inbox, S04)
      description: >
        Owner, manager, or assigned staff lists the hotel's chat conversations, filtered by status
        (the inbox typically uses status=escalated to see chats the bot handed off). Each item includes
        the customer, a preview of the last message, the assignee and lastMessageAt.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: status
          schema:
            type: string
            enum: [active, resolved, escalated, closed]
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Paginated conversations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedConversations' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/conversations/{conversationId}:
    get:
      summary: Get a conversation with all messages (staff)
      description: >
        Owner/manager/assigned staff views one conversation thread (all messages, oldest first) plus
        customer info.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/conversations/{conversationId}/reply:
    post:
      summary: Staff replies to a conversation (S04)
      description: >
        Saves a staff reply, assigns the conversation to the replying staff, and moves its status to
        "active" (taking it out of the escalated queue). Rejected if the conversation is closed.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - message
              properties:
                message:
                  type: string
                  maxLength: 2000
              example:
                message: Chào anh/chị, em là lễ tân, em hỗ trợ mình ngay ạ.
      responses:
        "201":
          description: Staff message saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        "400":
          description: Conversation already closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/conversations/{conversationId}/resolve:
    post:
      summary: Mark a conversation resolved (S04)
      description: >
        Owner/manager/assigned staff marks the conversation handled (status=resolved, resolvedAt set).
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: conversationId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conversation resolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/staff:
    get:
      summary: List staff assigned to a hotel (owner)
      description: Hotel owner or manageHotels lists active staff assignments (with user info).
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Active staff assignments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StaffAssignment' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Add a staff to a hotel — create new OR re-assign existing (owner)
      description: >
        Hotel owner or manageHotels. Behavior depends on the email:
        (1) email has NO account yet → creates a new active staff account (name + password required, no OTP —
        the owner vouches) and assigns it; (2) email already belongs to a staff account → RE-ASSIGNS it to
        this hotel (name/password ignored). Rule "1 staff = 1 hotel": re-assigning a staff who is currently
        active at ANY hotel is rejected (400). assignedRole ("staff") is the user's global role.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                  description: Required when creating a NEW account; ignored on re-assign
                password:
                  type: string
                  description: Required when creating a NEW account (min 8, at least 1 letter and 1 number); ignored on re-assign
                phone:
                  type: string
                assignedRole:
                  type: string
                  enum: [staff]
                  default: staff
      responses:
        '201':
          description: Staff created or re-assigned (user without passwordHash + assignment + reassigned flag)
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/MeProfile' }
                  assignment: { $ref: '#/components/schemas/StaffAssignment' }
                  reassigned: { type: boolean, description: true if an existing account was re-assigned instead of created }
        '400':
          description: >
            Email belongs to a non-staff account, staff already active at a hotel (1-staff-1-hotel),
            or missing name/password when creating a new account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /hotels/{hotelId}/staff/{userId}:
    get:
      summary: Get a staff member's detail (owner)
      description: Hotel owner or manageHotels views one assigned staff member's detail (user info + assignment).
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: userId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Staff assignment detail (with user info)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAssignmentDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Unassign a staff member from the hotel (owner)
      description: >
        Ends a staff member's assignment (sets unassignedAt) so they lose access to the hotel's
        operations. The user account itself is not deleted.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema:
            type: string
            format: uuid
        - in: path
          name: userId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Staff unassigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAssignment' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No active assignment for this staff at the hotel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /hotels/{hotelId}/reviews:
    get:
      summary: List reviews of my hotel (partner)
      description: >
        Hotel owner or manageHotels lists reviews of THEIR hotel — unlike the public GET /reviews this
        returns ALL statuses (pending/published/hidden) and can be filtered by status. Paginated.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { type: string, enum: [pending, published, hidden] }
        - in: query
          name: sortBy
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Paginated reviews of the hotel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginatedReviews' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/me/wallet:
    get:
      summary: Get my wallet balance and history
      description: >
        The signed-in guest's wallet: balance plus the newest transactions. Refunds taken as wallet
        credit land here and can be spent on future bookings via
        POST /payments/bookings/{bookingId}/wallet.


        A guest who has never been refunded has no wallet row — this returns an empty wallet with
        balance 0, not a 404.
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallet with transactions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerWallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /payments/bookings/{bookingId}/wallet:
    post:
      summary: Pay a booking from the wallet balance
      description: >
        Spends the guest's wallet balance on their own pending booking. The amount is decided by the
        server — min(balance, amount still owed) — so the client cannot choose it and cannot overspend.


        Covers everything → the booking is confirmed immediately and a voucher is issued; no gateway
        needed. Covers only part → the wallet is emptied into the booking, it stays pending with its
        hold intact, and remainingToPay tells you what to charge through VNPay/SePay. Those gateway
        endpoints already bill only the outstanding amount, so the guest is never charged twice.


        400 when the wallet is empty or the booking is already paid in full; 403 when the booking
        belongs to someone else.
      tags: [Payments]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: Wallet applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WalletPaymentResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /bookings/{bookingId}/refund-preview:
    get:
      summary: Preview the refund before cancelling
      description: >
        Read-only. Tells the guest how much they get back if they cancel RIGHT NOW, and why.
        Uses the same computation as PATCH /bookings/{bookingId}/cancel, so refundAmount here is
        exactly what the cancel call will request — as long as the guest cancels before
        freeUntilMoment passes (after that the free-cancellation window closes and the amount
        drops). Booking owner or manageBookings only.
      tags: [Bookings]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Refund preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/review-stats:
    get:
      summary: Get public review stats of a hotel (guest)
      description: >
        Aggregate review stats (total, average per category, star distribution) over the hotel's
        published reviews — for the guest-facing hotel detail page. No authentication required.
        Only listed hotels are returned; unlisted/unapproved hotels give 404 so their existence
        is not leaked. Same numbers as the partner endpoint /hotels/{hotelId}/reviews/stats,
        which additionally covers hotels that are not listed yet.
      tags: [Reviews]
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Aggregate review stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewStats' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/reviews/stats:
    get:
      summary: Get review stats of my hotel (partner)
      description: >
        Hotel owner or manageHotels gets aggregate review stats (total, average per category, star
        distribution) computed over the hotel's published reviews.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Aggregate review stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /hotels/{hotelId}/room-types/manage:
    get:
      summary: List room types for management (includes inactive)
      description: Hotel owner or manageHotels. Each item includes images, amenities and physical room count.
      tags: [HotelManagement]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hotelId
          required: true
