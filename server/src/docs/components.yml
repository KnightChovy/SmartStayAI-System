components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [user, admin]
      example:
        id: 5ebac534954b54139806c112
        email: fake@example.com
        name: fake name
        role: user

    UserProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        dateOfBirth: { type: string, format: date, nullable: true }
        nationality: { type: string, nullable: true }
        idCardNumber: { type: string, nullable: true }
        passportNumber: { type: string, nullable: true }
        preferredLanguage: { type: string, enum: [vi, en] }
        preferredCurrency: { type: string, enum: [VND, USD] }
        marketingOptIn: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    MeProfile:
      type: object
      description: The authenticated user's own account (passwordHash omitted) with its profile.
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        phone: { type: string, nullable: true }
        avatarUrl: { type: string, nullable: true }
        role: { type: string, enum: [guest, customer, staff, hotel_partner, platform_manager, admin] }
        status: { type: string, enum: [active, inactive, suspended] }
        emailVerifiedAt: { type: string, format: date-time, nullable: true }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        profile:
          allOf:
            - $ref: '#/components/schemas/UserProfile'
          nullable: true

    Token:
      type: object
      properties:
        token:
          type: string
        expires:
          type: string
          format: date-time
      example:
        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI1ZWJhYzUzNDk1NGI1NDEzOTgwNmMxMTIiLCJpYXQiOjE1ODkyOTg0ODQsImV4cCI6MTU4OTMwMDI4NH0.m1U63blB0MLej_WfB7yC2FTMnCziif9X8yzwDEfJXAg
        expires: 2020-05-12T16:18:04.793Z

    AuthTokens:
      type: object
      properties:
        access:
          $ref: '#/components/schemas/Token'
        refresh:
          $ref: '#/components/schemas/Token'

    Error:
      type: object
      properties:
        code:
          type: number
        message:
          type: string

    AmenityAssignment:
      type: object
      description: One amenity assigned to a hotel or room type (replace-all payload item).
      required: [amenityId]
      properties:
        amenityId: { type: string, format: uuid }
        isFree: { type: boolean, default: true, description: Free vs paid amenity }
        quantity: { type: integer, minimum: 0, nullable: true, description: Optional count (e.g. parking spots) }

    ReviewImage:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri }
        uploadedAt: { type: string, format: date-time }

    CreateReviewRequest:
      type: object
      required: [bookingId, overallRating, cleanlinessRating, serviceRating, locationRating, valueRating, content]
      properties:
        bookingId: { type: string, format: uuid }
        overallRating: { type: integer, minimum: 1, maximum: 5 }
        cleanlinessRating: { type: integer, minimum: 1, maximum: 5 }
        serviceRating: { type: integer, minimum: 1, maximum: 5 }
        locationRating: { type: integer, minimum: 1, maximum: 5 }
        valueRating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string, maxLength: 200 }
        content: { type: string, maxLength: 2000 }
        images:
          type: array
          maxItems: 10
          items: { type: string, format: uri }

    UpdateReviewRequest:
      type: object
      minProperties: 1
      description: All fields optional; at least one required. Sending `images` replaces the whole set.
      properties:
        overallRating: { type: integer, minimum: 1, maximum: 5 }
        cleanlinessRating: { type: integer, minimum: 1, maximum: 5 }
        serviceRating: { type: integer, minimum: 1, maximum: 5 }
        locationRating: { type: integer, minimum: 1, maximum: 5 }
        valueRating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string, maxLength: 200, nullable: true }
        content: { type: string, maxLength: 2000 }
        images:
          type: array
          maxItems: 10
          items: { type: string, format: uri }

    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        bookingId: { type: string, format: uuid }
        hotelId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        customer:
          type: object
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
        overallRating: { type: integer }
        cleanlinessRating: { type: integer }
        serviceRating: { type: integer }
        locationRating: { type: integer }
        valueRating: { type: integer }
        title: { type: string, nullable: true }
        content: { type: string }
        status: { type: string, enum: [pending, published, hidden] }
        images:
          type: array
          items: { $ref: '#/components/schemas/ReviewImage' }
        createdAt: { type: string, format: date-time }

    HotelRegistrationRequest:
      type: object
      required: [businessInfo, businessLicense, certificates, representative, propertyImages, roomConfig, paymentPayouts]
      properties:
        businessInfo:
          type: object
          required: [businessName, address, cityProvince]
          properties:
            businessName: { type: string }
            businessType: { type: string, enum: [hotel, resort, villa, apartment] }
            businessRegistrationNumber: { type: string }
            taxCode: { type: string }
            phone: { type: string }
            email: { type: string, format: email }
            address: { type: string }
            cityProvince: { type: string, example: hcmc }
            district: { type: string, example: d1 }
            ward: { type: string, example: w1 }
            location:
              type: object
              properties:
                lat: { type: number, example: 10.762622 }
                lng: { type: number, example: 106.660172 }
        businessLicense:
          type: object
          required: [documentFileUrl]
          properties:
            licenseNumber: { type: string }
            issueDate: { type: string, format: date }
            expiryDate: { type: string, format: date }
            authority: { type: string }
            status: { type: string, enum: [active, pending, expired] }
            documentFileUrl: { type: string, format: uri }
        certificates:
          type: object
          required: [operatingLicense, fireSafety]
          properties:
            operatingLicense:
              type: object
              required: [documentFileUrl]
              properties:
                licenseNumber: { type: string }
                issueDate: { type: string, format: date }
                authority: { type: string }
                documentFileUrl: { type: string, format: uri }
            fireSafety:
              type: object
              required: [documentFileUrl]
              properties:
                certificateNumber: { type: string }
                issueDate: { type: string, format: date }
                documentFileUrl: { type: string, format: uri }
            securityOrder:
              type: object
              properties:
                certificateNumber: { type: string }
                issueDate: { type: string, format: date }
                documentFileUrl: { type: string, format: uri }
            classification:
              type: object
              required: [starRating, ratingCertificateFileUrl]
              properties:
                starRating: { type: string, enum: ["1", "2", "3", "4", "5", unrated] }
                ratingCertificateFileUrl: { type: string, format: uri }
        representative:
          type: object
          required: [fullName, role, idNumber]
          properties:
            fullName: { type: string }
            role: { type: string, enum: [owner, general_manager, legal_representative, director] }
            dob: { type: string, format: date }
            idNumber: { type: string }
            phone: { type: string }
            address: { type: string }
            idFrontImageUrl: { type: string, format: uri }
            idBackImageUrl: { type: string, format: uri }
        propertyImages:
          type: object
          required: [coverImages, exteriorImages, roomImages]
          properties:
            coverImages: { type: array, minItems: 1, items: { type: string, format: uri } }
            exteriorImages: { type: array, minItems: 1, items: { type: string, format: uri } }
            roomImages: { type: array, minItems: 3, items: { type: string, format: uri } }
        roomConfig:
          type: object
          required: [totalRooms, roomTypes]
          properties:
            totalRooms: { type: integer, example: 50 }
            roomTypes:
              type: array
              minItems: 1
              items:
                type: object
                required: [name, quantity]
                properties:
                  name: { type: string, example: Deluxe }
                  quantity: { type: integer, example: 20 }
        paymentPayouts:
          type: object
          required: [bankAccount]
          properties:
            bankAccount:
              type: object
              required: [accountHolder, bankName, accountNumber]
              properties:
                accountHolder: { type: string }
                bankName: { type: string }
                accountNumber: { type: string }
                bankBranch: { type: string }
                swiftCode: { type: string }
            taxInvoice:
              type: object
              properties:
                taxIdVatNumber: { type: string }
                registeredBusinessAddress: { type: string }

    HotelVerificationDocument:
      type: object
      properties:
        id: { type: string, format: uuid }
        verificationRequestId: { type: string, format: uuid }
        documentType:
          type: string
          enum: [business_license, tax_certificate, owner_id, property_proof, operating_license, fire_safety, security_order, classification]
        fileUrl: { type: string, format: uri }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewedBy: { type: string, format: uuid, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        replacedById: { type: string, format: uuid, nullable: true }

    HotelLicense:
      type: object
      description: Master data of a license; the file lives in the linked verification document (currentDocumentId).
      properties:
        id: { type: string, format: uuid }
        licenseType: { type: string, enum: [business_license, operating_license, fire_safety, security_order, classification] }
        licenseNumber: { type: string, nullable: true }
        certificateNumber: { type: string, nullable: true }
        issueDate: { type: string, format: date, nullable: true }
        expiryDate: { type: string, format: date, nullable: true }
        authority: { type: string, nullable: true }
        validityStatus: { type: string, enum: [active, pending, expired], nullable: true }
        starRating: { type: string, enum: [star1, star2, star3, star4, star5, unrated], nullable: true }
        currentDocumentId: { type: string, format: uuid, nullable: true }
        currentDocument:
          allOf:
            - $ref: '#/components/schemas/HotelVerificationDocument'
          nullable: true

    HotelImage:
      type: object
      properties:
        id: { type: string, format: uuid }
        imageCategory: { type: string, enum: [cover, exterior, room] }
        url: { type: string, format: uri }
        caption: { type: string, nullable: true }
        isPrimary: { type: boolean, nullable: true }
        sortOrder: { type: integer, nullable: true }

    HotelVerificationRequest:
      type: object
      properties:
        id: { type: string, format: uuid }
        partnerId: { type: string, format: uuid }
        hotelId: { type: string, format: uuid }
        status: { type: string, enum: [pending, in_review, approved, rejected] }
        submittedAt: { type: string, format: date-time }
        reviewedBy: { type: string, format: uuid, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        rejectionReason: { type: string, nullable: true }
        reviewer:
          type: object
          nullable: true
          description: The platform manager who reviewed the request
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
            email: { type: string, format: email }
        hotel:
          type: object
          description: The hotel being verified (activated on approval)
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            city: { type: string }
            country: { type: string }
            starRating: { type: integer, nullable: true }
            latitude: { type: number, nullable: true }
            longitude: { type: number, nullable: true }
            isActive: { type: boolean }
            isListed: { type: boolean }
            images:
              type: array
              description: Hotel images (cover/exterior/room), ordered by sortOrder
              items: { $ref: '#/components/schemas/HotelImage' }
            roomConfig:
              type: object
              nullable: true
              description: Room configuration declared at registration
              properties:
                totalRooms: { type: integer }
                types:
                  type: array
                  items:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      quantity: { type: integer }
            representatives:
              type: array
              description: Legal representatives (with ID card images)
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  fullName: { type: string }
                  role: { type: string, enum: [owner, general_manager, legal_representative, director] }
                  dob: { type: string, format: date, nullable: true }
                  idNumber: { type: string }
                  phone: { type: string, nullable: true }
                  address: { type: string, nullable: true }
                  idFrontImageUrl: { type: string, format: uri, nullable: true }
                  idBackImageUrl: { type: string, format: uri, nullable: true }
            payoutAccounts:
              type: array
              description: Payout bank accounts (accountNumber omitted — encrypted, revealed only at payout)
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  accountHolder: { type: string }
                  bankName: { type: string }
                  bankBranch: { type: string, nullable: true }
                  swiftCode: { type: string, nullable: true }
                  taxIdVatNumber: { type: string, nullable: true }
                  registeredBusinessAddress: { type: string, nullable: true }
                  isPrimary: { type: boolean }
        partner:
          type: object
          properties:
            id: { type: string, format: uuid }
            businessName: { type: string }
            status: { type: string, enum: [pending, approved, suspended, rejected] }
        documents:
          type: array
          items: { $ref: '#/components/schemas/HotelVerificationDocument' }
        licenses:
          type: array
          items: { $ref: '#/components/schemas/HotelLicense' }

    HotelVerificationRequestSummary:
      type: object
      description: Lightweight shape returned by the list endpoint — no documents/licenses, hotel carries cover image only.
      properties:
        id: { type: string, format: uuid }
        partnerId: { type: string, format: uuid }
        hotelId: { type: string, format: uuid }
        status: { type: string, enum: [pending, in_review, approved, rejected] }
        submittedAt: { type: string, format: date-time }
        reviewedBy: { type: string, format: uuid, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        rejectionReason: { type: string, nullable: true }
        hotel:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            city: { type: string }
            country: { type: string }
            starRating: { type: integer, nullable: true }
            latitude: { type: number, nullable: true }
            longitude: { type: number, nullable: true }
            isActive: { type: boolean }
            isListed: { type: boolean }
            images:
              type: array
              description: Cover images only
              items: { $ref: '#/components/schemas/HotelImage' }
        partner:
          type: object
          properties:
            id: { type: string, format: uuid }
            businessName: { type: string }
            status: { type: string, enum: [pending, approved, suspended, rejected] }

    # ===== Phân trang dùng chung ({ results, page, limit, totalPages, totalResults }) =====
    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        totalPages: { type: integer, example: 5 }
        totalResults: { type: integer, example: 92 }

    # ===== Tiện nghi =====
    Amenity:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        icon: { type: string, nullable: true }
        category: { type: string, enum: [room, hotel, service] }
        createdAt: { type: string, format: date-time }

    HotelAmenity:
      type: object
      description: One amenity assigned to a hotel (catalog amenity + isFree/quantity).
      properties:
        hotelId: { type: string, format: uuid }
        amenityId: { type: string, format: uuid }
        isFree: { type: boolean }
        quantity: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        amenity: { $ref: '#/components/schemas/Amenity' }

    RoomTypeAmenity:
      type: object
      properties:
        roomTypeId: { type: string, format: uuid }
        amenityId: { type: string, format: uuid }
        isFree: { type: boolean }
        quantity: { type: integer, nullable: true }
        amenity: { $ref: '#/components/schemas/Amenity' }

    # ===== Loại phòng / phòng =====
    RoomTypeImage:
      type: object
      properties:
        id: { type: string, format: uuid }
        roomTypeId: { type: string, format: uuid }
        url: { type: string, format: uri }
        isPrimary: { type: boolean, nullable: true }
        sortOrder: { type: integer, nullable: true }

    RoomType:
      type: object
      description: A room type with its images, amenities and (on management endpoints) physical room count.
      properties:
        id: { type: string, format: uuid }
        hotelId: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        maxOccupancy: { type: integer }
        basePrice: { type: string, description: Decimal as string }
        areaSqm: { type: string, nullable: true }
        bedType: { type: string, nullable: true }
        viewType: { type: string, nullable: true }
        isActive: { type: boolean }
        maxAdults: { type: integer, nullable: true }
        maxChildren: { type: integer, nullable: true }
        sizeUnit: { type: string, enum: [sqm, sqft], nullable: true }
        isNonSmoking: { type: boolean }
        hasPrivateBathroom: { type: boolean }
        hasBalcony: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        numNights: { type: integer, description: 'Only when checkIn/checkOut are given' }
        availableRooms: { type: integer, description: 'Only when checkIn/checkOut are given' }
        subtotal: { type: string, description: 'Only with dates. Room charge for the whole stay (pricing rules + priceOverride applied), before tax and fees. Matches booking.subtotal' }
        taxAmount: { type: string, description: 'Only with dates. Tax from the hotel tax policies. Matches booking.taxAmount' }
        feeAmount: { type: string, description: 'Only with dates. Service fees from the hotel fee policies. Matches booking.feeAmount' }
        totalPrice: { type: string, description: 'Only with dates. TOTAL PAYABLE = subtotal + taxAmount + feeAmount — the same figure as booking.totalAmount. Previously this excluded tax/fee' }
        images:
          type: array
          items: { $ref: '#/components/schemas/RoomTypeImage' }
        amenities:
          type: array
          items: { $ref: '#/components/schemas/RoomTypeAmenity' }
        beds:
          type: array
          items: { $ref: '#/components/schemas/RoomBed' }
        _count:
          type: object
          description: Present on management endpoints only.
          properties:
            rooms: { type: integer }

    RoomBed:
      type: object
      description: One bed-configuration row of a room type.
      properties:
        id: { type: string, format: uuid }
        roomTypeId: { type: string, format: uuid }
        bedType: { type: string, enum: [single, double, queen, king, sofa_bed, bunk] }
        quantity: { type: integer }
        createdAt: { type: string, format: date-time }

    Room:
      type: object
      properties:
        id: { type: string, format: uuid }
        hotelId: { type: string, format: uuid }
        roomTypeId: { type: string, format: uuid }
        roomNumber: { type: string }
        floor: { type: integer, nullable: true }
        status: { type: string, enum: [available, occupied, maintenance, cleaning, blocked] }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        roomType:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }

    # ===== Khách sạn (chi tiết + tóm tắt) =====
    Hotel:
      type: object
      description: Full hotel profile (public detail / management detail) with images, hotel amenities and room types.
      properties:
        id: { type: string, format: uuid }
        partnerId: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string, nullable: true }
        description: { type: string, nullable: true }
        address: { type: string }
        city: { type: string }
        country: { type: string }
        businessType: { type: string, enum: [hotel, resort, villa, apartment], nullable: true }
        district: { type: string, nullable: true }
        ward: { type: string, nullable: true }
        latitude: { type: string, nullable: true }
        longitude: { type: string, nullable: true }
        starRating: { type: integer, nullable: true, description: 'Hotel star classification (1-5), not a guest score' }
        avgRating: { type: number, nullable: true, description: 'Average guest score over published reviews, rounded to 1 decimal. null when the hotel has no review yet (not 0)' }
        reviewCount: { type: integer, description: 'Number of published reviews' }
        cancellationRule:
          allOf:
            - $ref: '#/components/schemas/CancellationRule'
          description: 'Returned on the public hotel detail. The numbers that decide the refund — not the free-text cancellationPolicy field'
        checkInTime: { type: string, nullable: true }
        checkOutTime: { type: string, nullable: true }
        isActive: { type: boolean }
        isListed: { type: boolean }
        postalCode: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        email: { type: string, nullable: true }
        totalFloors: { type: integer, nullable: true }
        builtYear: { type: integer, nullable: true }
        renovationYear: { type: integer, nullable: true }
        isSmokingAllowed: { type: boolean }
        petsPolicy: { type: string, enum: [not_allowed, allowed, on_request], nullable: true }
        cancellationPolicy: { type: string, nullable: true }
        childrenPolicy: { type: string, nullable: true }
        minGuestAge: { type: integer, nullable: true }
        securityDepositAmount: { type: string, nullable: true, description: Decimal as string }
        languagesSpoken: { type: array, nullable: true, items: { type: string } }
        maxLengthOfStay: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        images:
          type: array
          items: { $ref: '#/components/schemas/HotelImage' }
        amenities:
          type: array
          items: { $ref: '#/components/schemas/HotelAmenity' }
        contacts:
          type: array
          items: { $ref: '#/components/schemas/HotelContact' }
        policies:
          type: array
          description: 'House rules to read, important ones first. No effect on price'
          items: { $ref: '#/components/schemas/HotelPolicy' }
        charges:
          type: array
          description: 'Taxes and fees added to the total — use these to explain the price breakdown'
          items: { $ref: '#/components/schemas/HotelCharge' }
        nearbyPlaces:
          type: array
          items: { $ref: '#/components/schemas/HotelNearbyPlace' }
        roomTypes:
          type: array
          items: { $ref: '#/components/schemas/RoomType' }

    HotelContact:
      type: object
      properties:
        id: { type: string, format: uuid }
        hotelId: { type: string, format: uuid }
        contactType: { type: string, enum: [physical_location, general, availability, invoices] }
        name: { type: string, nullable: true }
        jobTitle: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        phoneType: { type: string, enum: [voice, fax, mobile], nullable: true }

    HotelPolicy:
      type: object
      description: >
        A house rule the hotel wants guests to read. Plain text — it has NO effect on any amount.
        Money lives elsewhere: taxes and fees are HotelCharge, and the refund terms are
        hotel.settings.cancellation (exposed as Hotel.cancellationRule).
        Returned with important ones first.
      properties:
        id: { type: string, format: uuid }
        hotelId: { type: string, format: uuid }
        title: { type: string, example: 'Chính sách huỷ phòng' }
        description: { type: string, nullable: true }
        important: { type: boolean, description: 'Highlight this one — easy to miss and often disputed' }

    HotelCharge:
      type: object
      description: >
        A tax or fee ADDED to the booking total. Changing these changes what guests pay on NEW
        bookings; existing bookings keep the amounts frozen at booking time.
      properties:
        id: { type: string, format: uuid }
        hotelId: { type: string, format: uuid }
        chargeType: { type: string, enum: [tax, fee] }
        name: { type: string, example: 'VAT' }
        amount: { type: string, description: 'Decimal as string. A percentage value when isPercentage is true, otherwise an absolute amount' }
        isPercentage: { type: boolean, description: 'True → amount is a % of the room charge and chargeFrequency is unused (never null-checked against nights)' }
        chargeFrequency:
          type: string
          enum: [per_stay, per_night, per_person, per_person_per_night]
          nullable: true
          description: 'Multiplier for absolute amounts. Always null when isPercentage is true'

    HotelNearbyPlace:
      type: object
      properties:
        id: { type: string, format: uuid }
        hotelId: { type: string, format: uuid }
        name: { type: string }
        category: { type: string, enum: [attraction, beach, airport, restaurant, public_transport, landmark, nature] }
        distance: { type: string, description: Decimal as string }
        distanceUnit: { type: string, enum: [km, miles] }
        transportType: { type: string, enum: [walk, car, public_transport, taxi, shuttle], nullable: true }
        journeyMinutes: { type: integer, nullable: true }

    HotelSummary:
      type: object
      description: Hotel list item from search — scalar fields + cover image + "from" price (minPrice) + guest rating.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: string }
        country: { type: string }
        address: { type: string }
        starRating: { type: integer, nullable: true, description: 'Hotel star classification (1-5), not a guest score' }
        avgRating: { type: number, nullable: true, description: 'Average guest score over published reviews, rounded to 1 decimal. null when the hotel has no review yet (not 0)' }
        reviewCount: { type: integer, description: 'Number of published reviews' }
        isActive: { type: boolean }
        isListed: { type: boolean }
        minPrice: { type: string, nullable: true, description: 'Lowest nightly price among matching room types (Decimal as string), excluding tax and fees. With checkIn/checkOut it is the real price for those dates (pricing rules and priceOverride applied, averaged per night, only rooms still available); without dates, rules cannot be resolved so it falls back to the lowest basePrice' }
        images:
          type: array
          description: Cover image only
          items: { $ref: '#/components/schemas/HotelImage' }

    AdminHotelSummary:
      type: object
      description: Hotel list item for platform admin/manager oversight.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: string }
        starRating: { type: integer, nullable: true }
        isActive: { type: boolean }
        isListed: { type: boolean }
        createdAt: { type: string, format: date-time }
        partner:
          type: object
          properties:
            id: { type: string, format: uuid }
            businessName: { type: string }

    # ===== Pricing rule =====
