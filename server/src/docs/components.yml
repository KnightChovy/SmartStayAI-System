        bookingCode: { type: string }
        customerId: { type: string, format: uuid }
        hotelId: { type: string, format: uuid }
        roomTypeId: { type: string, format: uuid }
        checkInDate: { type: string, format: date }
        checkOutDate: { type: string, format: date }
        numNights: { type: integer }
        numGuests: { type: integer }
        totalAmount: { type: string, description: Decimal as string }
        status: { type: string, enum: [pending, confirmed, checked_in, checked_out, cancelled, no_show] }
        source: { type: string, enum: [website, mobile_app, walk_in, ota] }
        createdAt: { type: string, format: date-time }
        customer:
          type: object
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
            email: { type: string, format: email }
            phone: { type: string, nullable: true }
        hotel:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            city: { type: string }
        roomType:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }

    # ===== Hoa hồng / payout =====
