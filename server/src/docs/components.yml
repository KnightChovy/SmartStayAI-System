    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        action: { type: string }
        entityType: { type: string }
        entityId: { type: string, format: uuid }
        oldValue: { type: object, nullable: true }
        newValue: { type: object, nullable: true }
        ipAddress: { type: string, nullable: true }
        userAgent: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    # ===== Analytics & Performance (Platform Manager) =====
    PlatformAnalytics:
      type: object
      description: Platform-wide analytics report (totals, time-series, top city/hotel).
      properties:
        totals:
          type: object
          properties:
            totalBookings: { type: integer }
            confirmedBookings: { type: integer }
            conversionRate: { type: number, description: confirmed / total bookings (0..1) }
            totalUsers: { type: integer }
        period: { type: string, enum: [month, year] }
        range: { type: integer }
        timeSeries:
          type: array
          items:
            type: object
            properties:
              period: { type: string, example: '2026-07' }
              bookings: { type: integer }
              confirmedBookings: { type: integer }
              newUsers: { type: integer }
        topCities:
          type: array
          items:
            type: object
            properties:
              city: { type: string }
              bookings: { type: integer }
        topHotels:
          type: array
          items:
            type: object
            properties:
              hotelId: { type: string, format: uuid }
              name: { type: string }
              bookings: { type: integer }

    HotelPerformance:
      type: object
      description: >
        One hotel's performance + composite score over a window (default last 90 days). Metrics that
        have no data are null and are excluded from the weighted score (weights re-normalized).
      properties:
        hotelId: { type: string, format: uuid }
        hotelName: { type: string }
        city: { type: string }
        window:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        metrics:
          type: object
          properties:
            occupancyRate: { type: number, nullable: true, description: '0..1 (Σ bookedRooms / Σ totalRooms)' }
            cancellationRate: { type: number, nullable: true, description: '0..1 (cancelled / total bookings)' }
            avgRating: { type: number, nullable: true, description: '0..5 (published reviews, lifetime)' }
            avgResponseMinutes: { type: number, nullable: true, description: avg minutes from a guest message to the next staff reply }
            totalBookings: { type: integer }
            cancelledBookings: { type: integer }
            reviewCount: { type: integer }
        scores:
          type: object
          description: Each component normalized to 0..100 (null if no data)
          properties:
            rating: { type: integer, nullable: true }
            occupancy: { type: integer, nullable: true }
            cancellation: { type: integer, nullable: true }
            response: { type: integer, nullable: true }
        score: { type: integer, nullable: true, description: 'Weighted composite 0..100 (rating 40% / occupancy 25% / cancel 20% / response 15%)' }

    PerformanceLeaderboard:
      type: object
      description: All hotels ranked by performance score (highest first; hotels lacking data are last).
      properties:
        window:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        hotels:
          type: array
          items:
            type: object
            properties:
              hotelId: { type: string, format: uuid }
              hotelName: { type: string }
              city: { type: string }
              score: { type: integer, nullable: true }
              occupancyRate: { type: number, nullable: true }
              cancellationRate: { type: number, nullable: true }
              avgRating: { type: number, nullable: true }
              avgResponseMinutes: { type: number, nullable: true }

    PartnerSummary:
      type: object
      description: Hotel partner list item for Platform Manager oversight.
      properties:
        id: { type: string, format: uuid }
        businessName: { type: string }
        status: { type: string, enum: [pending, approved, suspended, rejected] }
        commissionRate: { type: string, description: Decimal as string }
        contactEmail: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        owner:
          type: object
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
            email: { type: string, format: email }
        _count:
          type: object
          properties:
            hotels: { type: integer }

    # ===== Bao phân trang theo từng entity (allOf Pagination + results) =====
    PaginatedPartners:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/PartnerSummary' } }

    PaginatedHotels:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/HotelSummary' } }

    PaginatedAdminHotels:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/AdminHotelSummary' } }

    PaginatedCommissions:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/Commission' } }

    PaginatedAuditLogs:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }

    PaginatedBookings:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/Booking' } }

    PaginatedStaffBookings:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/StaffBooking' } }

    PaginatedOversightBookings:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/OversightBooking' } }

    PaginatedReviews:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/Review' } }

    PaginatedConversations:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/ConversationSummary' } }

    PaginatedRooms:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/Room' } }

    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        type:
          type: string
          enum: [booking_confirmed, payment_success, check_in_reminder, review_request, alert, promotion, partner_approved]
        title: { type: string }
        body: { type: string }
        data: { type: object, nullable: true, description: Optional structured payload (e.g. bookingId) }
        channel:
          type: string
          enum: [push, email, sms, in_app]
        status:
          type: string
          enum: [pending, sent, failed, read]
        sentAt: { type: string, format: date-time, nullable: true }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    PaginatedNotifications:
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            results: { type: array, items: { $ref: '#/components/schemas/Notification' } }
            unreadCount: { type: integer, description: Total unread notifications across all types, example: 3 }

  responses:
    BadRequest:
      description: Validation error or business rule violated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Invalid request
    DuplicateEmail:
      description: Email already taken
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 400
            message: Email already taken
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 401
            message: Please authenticate
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 403
            message: Forbidden
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: 404
            message: Not found

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
