      type: object
      properties:
        id: { type: string, format: uuid }
        hotelId: { type: string, format: uuid }
        roomTypeId: { type: string, format: uuid, nullable: true }
        name: { type: string }
        ruleType: { type: string, enum: [seasonal, day_of_week, occupancy_based, last_minute, early_bird] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        dayOfWeek: { type: array, items: { type: integer } }
        occupancyThreshold: { type: integer, nullable: true }
        adjustmentType: { type: string, enum: [percentage, fixed_amount] }
        adjustmentValue: { type: string, description: Decimal as string }
        priority: { type: integer }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ===== Booking =====
    BookingVoucher:
      type: object
      properties:
        voucherCode: { type: string }
        usedAt: { type: string, format: date-time, nullable: true }

    Deal:
      type: object
      description: >
        A live promotion on a listed hotel, shaped for the guest /deals page. Only promotions that
        are active, inside their date window, and not out of uses are returned.
      properties:
        promotionId: { type: string, format: uuid }
        hotelId: { type: string, format: uuid }
        hotelName: { type: string }
        city: { type: string }
        image: { type: string, nullable: true, description: 'Hotel primary image URL, null if none' }
        code: { type: string, example: SUMMER25 }
        name: { type: string }
        originalPrice: { type: string, description: 'Decimal as string — lowest applicable room base price' }
        discountedPrice: { type: string, description: 'Decimal as string, never below 0' }
        discountPercent: { type: integer, description: 'Actual percent off (rounded). For free_night it is the effective discount over the minimum stay' }
        dealType: { type: string, enum: [flash_sale, standard], description: 'flash_sale when expiring within 48h (derived from endDate, no schema column)' }
        expiresAt: { type: string, format: date-time }

    CustomerWallet:
      type: object
      description: >
        The guest's wallet. Money lands here when a refund is taken as wallet credit, and is spent
        on future bookings. A guest who has never been refunded has no wallet row yet — the endpoint
        returns an empty wallet (balance 0) rather than 404.
      properties:
        id: { type: string, format: uuid, nullable: true, description: 'null when no wallet row exists yet' }
        customerId: { type: string, format: uuid }
        balanceAvailable: { type: string, description: 'Decimal as string — spendable right away' }
        currency: { type: string, example: VND }
        transactions:
          type: array
          description: 'Newest first'
          items: { $ref: '#/components/schemas/WalletTransaction' }

    WalletTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [earning, commission, payout, refund, adjustment, spend]
          description: 'On a guest wallet only two appear: refund (credit, positive) and spend (debit, negative)'
        amount: { type: string, description: 'Signed: positive credits, negative debits' }
        balanceAfter: { type: string }
        bookingId: { type: string, format: uuid, nullable: true }
        description: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    WalletPaymentResult:
      type: object
      description: Result of paying a booking from the wallet balance.
      properties:
        bookingCode: { type: string }
        walletApplied: { type: string, description: 'Taken from the wallet — min(balance, amount still owed), never more' }
        remainingToPay: { type: string, description: '0 means fully paid; otherwise pay this much through a gateway' }
        bookingStatus: { type: string, enum: [pending, confirmed], description: 'confirmed when the wallet covered everything' }
        voucherCode: { type: string, nullable: true, description: 'Issued only once the booking is confirmed' }
        walletBalance: { type: string, description: 'Balance left after this payment' }

    CancellationRule:
      type: object
      description: >
        The cancellation terms that actually decide the refund, by number. A hotel may also write
        free-text descriptions (hotel.cancellationPolicy and the policies[cancellation] row) — those
        are for reading only and are NOT tied to these numbers, so show these values next to the
        text rather than trusting the text alone.
      properties:
        freeUntilHours: { type: integer, description: 'Cancel more than this many hours before check-in time to get a 100% refund' }
        latePenalty: { type: string, enum: [first_night, full], description: 'What is kept on a late cancellation: the first night, or everything' }

    RefundPreview:
      type: object
      description: What the guest gets back if they cancel right now, and why.
      properties:
        bookingId: { type: string, format: uuid }
        bookingCode: { type: string }
        status: { type: string, enum: [pending, confirmed, checked_in, checked_out, cancelled, no_show] }
        canCancel: { type: boolean, description: 'False when already checked in / cancelled, or check-in date has arrived' }
        cannotCancelReason: { type: string, nullable: true, description: 'Why canCancel is false; null when it is true' }
        isPaid: { type: boolean, description: 'False when nothing has been paid yet — then there is no money to refund' }
        paidAmount: { type: string, description: 'Decimal as string' }
        refundAmount: { type: string, description: 'Refunded if cancelling now' }
        penaltyAmount: { type: string, description: 'paidAmount - refundAmount — the part kept by the hotel' }
        freeUntilHours: { type: integer }
        latePenalty: { type: string, enum: [first_night, full] }
        isFreeCancellation: { type: boolean, description: 'True while still inside the free window (refundAmount = paidAmount)' }
        hoursBeforeCheckIn: { type: number, description: 'Hours left until check-in time; negative once it has passed' }
        freeUntilMoment: { type: string, format: date-time, description: 'Cancel before this instant for a full refund — use it for a countdown' }
        checkInMoment: { type: string, format: date-time, description: 'Check-in date combined with the hotel check-in time' }

    Booking:
      type: object
      description: Booking for the guest portal (with summarized hotel + room type).
      properties:
        id: { type: string, format: uuid }
        bookingCode: { type: string }
        customerId: { type: string, format: uuid }
        hotelId: { type: string, format: uuid }
        roomTypeId: { type: string, format: uuid }
        checkInDate: { type: string, format: date }
        checkOutDate: { type: string, format: date }
        numNights: { type: integer }
        numGuests: { type: integer }
        basePricePerNight: { type: string, description: Decimal as string }
        subtotal: { type: string, description: 'Room charge only (nightly prices with pricing rules applied), before tax and fees' }
        discountAmount: { type: string }
        taxAmount: { type: string, description: 'Tax frozen from the hotel tax policies at booking time' }
        feeAmount: { type: string, description: 'Service fees frozen from the hotel fee policies at booking time' }
        totalAmount: { type: string, description: 'subtotal - discountAmount + taxAmount + feeAmount' }
        status: { type: string, enum: [pending, confirmed, checked_in, checked_out, cancelled, no_show] }
        source: { type: string, enum: [website, mobile_app, walk_in, ota] }
        specialRequests: { type: string, nullable: true }
        holdExpiresAt: { type: string, format: date-time, nullable: true }
        checkedInAt: { type: string, format: date-time, nullable: true }
        checkedOutAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        hotel:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            address: { type: string }
            city: { type: string }
            checkInTime: { type: string, nullable: true }
            checkOutTime: { type: string, nullable: true }
        roomType:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            bedType: { type: string, nullable: true }
            viewType: { type: string, nullable: true }
            maxOccupancy: { type: integer }
        payments:
          type: array
          description: >
            Payments of this booking, newest first, each with its refund requests — so the guest can
            follow a cancellation end-to-end (pending → approved → processed, or rejected + reason)
            without any extra endpoint. Raw gateway data (gatewayResponse, transactionId) is NOT exposed.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              paymentMethod: { type: string, enum: [vnpay, sepay, stripe, cash] }
              status: { type: string, enum: [pending, completed, failed, refunded] }
              amount: { type: string, description: Decimal as string }
              paidAt: { type: string, format: date-time, nullable: true }
              refunds:
                type: array
                description: Refund requests for this payment, newest first
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    amount: { type: string }
                    status: { type: string, enum: [pending, approved, processed, rejected] }
                    reason: { type: string }
                    rejectionReason: { type: string, nullable: true }
                    reviewedAt: { type: string, format: date-time, nullable: true }
                    processedAt: { type: string, format: date-time, nullable: true }
                    createdAt: { type: string, format: date-time }

    Refund:
      type: object
      description: >
        A refund request. Lifecycle: `pending` (guest cancelled a paid booking, waiting for the hotel
        to review) → `approved` → `processed`, or `rejected`. Money only leaves the hotel
        wallet/commission at the `processed` step.


        How it reaches `processed` depends on `refundMethod`. With `wallet` the money never leaves
        the platform, so approval credits the guest instantly and the request goes straight from
        `pending` to `processed` — it never rests on `approved`, and the Platform Manager has nothing
        to do (calling process on it returns 400). With `bank` it waits on `approved` until the
        Platform Manager transfers the money and records the real transaction id.


        The hotel has **3 days** to review. After that a nightly job auto-approves the request, because
        the refund amount comes from the hotel's OWN cancellation policy — reviewing is for exceptions,
        not a veto. An auto-approved request has `reviewedAt` set but `reviewedBy: null` (nobody clicked),
        so the UI can label it "tự động duyệt (quá hạn phản hồi)".


        Orphan-money refunds (payment arrived after the hold expired) skip every step: they are
        credited to the guest wallet immediately as `processed`. There is nothing for the hotel to
        review — it is a system fault, and the guest should not wait for it.
      properties:
        id: { type: string, format: uuid }
        amount:
          type: string
          description: Refund amount computed from the hotel cancellation policy (Decimal as string)
          example: '950000.00'
        reason: { type: string, description: Why the guest asked to cancel/refund }
        status:
          type: string
          enum: [pending, approved, processed, rejected]
        refundMethod:
          type: string
          enum: [wallet, bank]
          description: 'Chosen by the guest when cancelling. Defaults to wallet'
        bankName: { type: string, nullable: true, description: 'Only with refundMethod bank' }
        bankAccountHolder: { type: string, nullable: true, description: 'Only with refundMethod bank' }
        rejectionReason: { type: string, nullable: true }
        refundTransactionId:
          type: string
          nullable: true
          description: Real bank/gateway transaction id, filled in at the processed step
        reviewedAt: { type: string, format: date-time, nullable: true }
        processedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        requesterUser:
          type: object
          description: Guest who asked for the refund
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
            email: { type: string }
            phone: { type: string, nullable: true }
        reviewer:
          type: object
          nullable: true
          description: >
            Hotel-side user who approved/rejected. NULL together with a non-null `reviewedAt` means the
            system auto-approved it after the 3-day review deadline passed.
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
        payment:
          type: object
          properties:
            id: { type: string, format: uuid }
            paymentMethod: { type: string, enum: [vnpay, sepay, stripe, cash] }
            amount: { type: string }
            paidAt: { type: string, format: date-time, nullable: true }
            booking:
              type: object
              properties:
                id: { type: string, format: uuid }
                bookingCode: { type: string }
                checkInDate: { type: string, format: date }
                checkOutDate: { type: string, format: date }
                totalAmount: { type: string }
                status: { type: string }
                cancelledAt: { type: string, format: date-time, nullable: true }
                cancellationReason: { type: string, nullable: true }
                hotel:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }
                    city: { type: string }
                roomType:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    name: { type: string }

    StaffBooking:
      type: object
      description: Booking for the staff/owner operations screen (guest + assigned rooms + voucher).
      properties:
        id: { type: string, format: uuid }
        bookingCode: { type: string }
